<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IFRO Esportes - Recuperar matrícula</title>
  <link rel="icon" type="image/png" href="assets/ifro.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --brand-1: #00A877;
      --brand-2: #0A5D54;
      --bg: #f6fbf9;
      --card: #ffffff;
      --text: #0b1f1a;
      --muted: #56736c;
      --border: rgba(10, 93, 84, 0.12);
      --shadow: 0 18px 40px rgba(16, 60, 52, 0.12);
      --radius: 20px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #071613;
        --card: #0d1f1b;
        --text: #e8f6f2;
        --muted: #9bb7b0;
        --border: rgba(0, 168, 119, 0.18);
        --shadow: 0 18px 40px rgba(0, 0, 0, 0.4);
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter", system-ui, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      min-height: 100vh;
    }

    .auth-shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 48px 20px;
    }

    .wrap {
      width: 100%;
      max-width: 980px;
      display: grid;
      gap: 24px;
      grid-template-columns: 1.1fr .9fr;
      align-items: center;
    }

    .hero {
      display: grid;
      gap: 10px;
    }

    .hero h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: -0.4px;
    }

    .hero p {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: var(--shadow);
      display: grid;
      gap: 14px;
    }

    .card h2 {
      margin: 0;
      font-size: 18px;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .btn {
      padding: 12px 18px;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-weight: 600;
      text-decoration: none;
      color: var(--text);
      background: transparent;
    }

    .btn.primary {
      background: linear-gradient(140deg, var(--brand-1), var(--brand-2));
      color: #ffffff;
      border: none;
      box-shadow: 0 12px 26px rgba(0, 168, 119, 0.28);
    }

    .art {
      display: grid;
      place-items: center;
      gap: 14px;
    }

    .oops {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
      color: var(--muted);
    }

    @media (max-width: 900px) {
      .wrap {
        grid-template-columns: 1fr;
      }
      .art { order: -1; }
    }
  </style>
</head>
<body>
  <main class="auth-shell">
    <div class="wrap">
      <section class="hero">
        <h1>Recuperar matrícula</h1>
        <p>Para recuperar sua matrícula, fale com o suporte institucional. Tenha em mãos um documento oficial.</p>
        <div class="card">
          <h2>Precisa de ajuda?</h2>
          <p>Entre em contato com o suporte e informe seu nome completo e campus.</p>
          <p><strong>Suporte:</strong> suporte@ifro.edu.br</p>
          <div class="actions">
            <a class="btn primary" href="mailto:suporte@ifro.edu.br">Entrar em contato</a>
            <a class="btn" href="index.html">Voltar ao login</a>
          </div>
        </div>
      </section>
