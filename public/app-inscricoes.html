<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JICS - Inscricoes</title>
  <link rel="icon" type="image/png" href="assets/ifro.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/light-override.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300,0,0" rel="stylesheet" />
</head>
<body data-theme="light">
  <div id="appShell">
    <nav class="navbar">
      <div class="navbar-left">
        <button class="icon-btn nav-hamburger" onclick="toggleSideNav()" aria-label="Abrir menu">
          <span class="material-symbols-outlined">menu</span>
        </button>
        <button class="navbar-brand">Inscricoes</button>
      </div>
      <div class="navbar-right">
        <button class="btn-outline" onclick="toggleTheme()">Tema</button>
        <button id="btnSair" class="btn-danger">Sair</button>
      </div>
    </nav>

    <div class="app-body">
      <aside id="sideNav" class="side-drawer">
        <div class="side-header">Menu</div>
        <a class="side-link" href="app-dashboard.html">Dashboard</a>
        <a class="side-link active" href="app-inscricoes.html">Inscricoes</a>
        <a class="side-link" href="app-meus-jogos.html">Meus jogos</a>
        <a class="side-link" href="app-ranking.html">Ranking</a>
        <a class="side-link" href="app-perfil.html">Perfil</a>
        <a class="side-link" href="app-ajuda.html">Ajuda</a>
      </aside>

      <main class="page with-bottom-nav">
        <section class="card">
          <div class="admin-tabs">
            <button id="tabDisponiveis" class="pill-tab pill-tab-active">Disponiveis</button>
            <button id="tabMinhas" class="pill-tab">Minhas inscricoes</button>
          </div>
        </section>

        <section id="panelDisponiveis" class="card">
          <div class="page-title">Modalidades disponiveis</div>
          <div class="page-subtitle">Escolha e confirme sua inscricao.</div>
          <div id="listaModalidades" class="card-grid" style="margin-top:12px;"></div>
        </section>

        <section id="panelMinhas" class="card hidden">
          <div class="page-title">Minhas inscricoes</div>
          <div class="page-subtitle">Acompanhe o status das inscricoes.</div>
          <div id="listaMinhas" class="table-responsive" style="margin-top:12px;"></div>
        </section>
      </main>
    </div>

    <div id="sideOverlay" class="overlay"></div>

    <nav class="bottom-nav">
      <a class="bottom-link" href="app-dashboard.html">
        <span class="material-symbols-outlined">home</span>
        Dashboard
      </a>
      <a class="bottom-link active" href="app-inscricoes.html">
        <span class="material-symbols-outlined">how_to_reg</span>
        Inscricoes
      </a>
      <a class="bottom-link" href="app-meus-jogos.html">
        <span class="material-symbols-outlined">sports_soccer</span>
        Jogos
      </a>
      <a class="bottom-link" href="app-ranking.html">
        <span class="material-symbols-outlined">leaderboard</span>
        Ranking
      </a>
      <a class="bottom-link" href="app-perfil.html">
        <span class="material-symbols-outlined">person</span>
        Perfil
      </a>
    </nav>
  </div>

  <script src="ui-kit.js"></script>
  <script>
    const sideNav = document.getElementById('sideNav');
    const sideOverlay = document.getElementById('sideOverlay');
    const tabDisponiveis = document.getElementById('tabDisponiveis');
    const tabMinhas = document.getElementById('tabMinhas');
    const panelDisponiveis = document.getElementById('panelDisponiveis');
    const panelMinhas = document.getElementById('panelMinhas');

    function toggleSideNav() {
      sideNav.classList.toggle('open');
      sideOverlay.classList.toggle('active');
    }

    sideOverlay.addEventListener('click', () => {
      sideNav.classList.remove('open');
      sideOverlay.classList.remove('active');
    });

    document.getElementById('btnSair').addEventListener('click', () => {
      openConfirmModal({
        title: 'Sair do sistema',
        message: 'Digite CONFIRMAR para sair.',
        confirmText: 'CONFIRMAR',
        onConfirm: async () => {
          await fetch('/auth/aluno/logout', { method: 'POST', credentials: 'include' });
          window.location.href = 'app-login.html';
        }
      });
    });

    function activateTab(showDisponiveis) {
      tabDisponiveis.classList.toggle('pill-tab-active', showDisponiveis);
      tabMinhas.classList.toggle('pill-tab-active', !showDisponiveis);
      panelDisponiveis.classList.toggle('hidden', !showDisponiveis);
      panelMinhas.classList.toggle('hidden', showDisponiveis);
    }

    tabDisponiveis.addEventListener('click', () => activateTab(true));
    tabMinhas.addEventListener('click', () => activateTab(false));

    async function api(url, options) {
      showLoading(true);
      try {
        const res = await fetch(url, { credentials: 'include', ...(options || {}) });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || data.sucesso === false) throw new Error(data?.erro?.mensagem || 'Erro');
        return data.data || data;
      } finally {
        showLoading(false);
      }
    }

    function renderModalidades(list) {
      const container = document.getElementById('listaModalidades');
      if (!list.length) {
        container.innerHTML = '<div class="empty-state">Sem modalidades disponiveis.</div>';
        return;
      }
      container.innerHTML = list.map(m => `
        <div class="card">
          <div class="card-title">${m.nome || m.titulo}</div>
          <div class="page-subtitle">${m.descricao || 'Modalidade esportiva.'}</div>
          <div class="card-actions">
            <button class="btn-primary" onclick="inscrever('${m.id}')">Inscrever</button>
          </div>
        </div>
      `).join('');
    }

    function renderMinhas(list) {
      const container = document.getElementById('listaMinhas');
      if (!list.length) {
        container.innerHTML = '<div class="empty-state">Sem inscricoes.</div>';
        return;
      }
      container.innerHTML = `
        <table class="table">
          <thead>
            <tr>
              <th>Modalidade</th>
              <th>Status</th>
              <th>Acao</th>
            </tr>
          </thead>
          <tbody>
            ${list.map(i => `
              <tr>
                <td>${i.modalidade || i.nome}</td>
                <td>${i.status || 'ATIVA'}</td>
                <td><button class="btn-link" onclick="cancelar('${i.id}')">Cancelar</button></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    async function carregar() {
      try {
        const modalidades = await api('/modalidades');
        renderModalidades(modalidades || []);
      } catch {
        renderModalidades([]);
      }

      try {
        const inscricoes = await api('/aluno/inscricoes');
        renderMinhas(inscricoes || []);
      } catch {
        renderMinhas([]);
      }
    }

    window.inscrever = async (modalidadeId) => {
      try {
        await api('/aluno/inscricoes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ modalidade_id: modalidadeId })
        });
        showToast({ type: 'success', title: 'Inscrito', message: 'Inscricao realizada.' });
        carregar();
      } catch (err) {
        showToast({ type: 'error', title: 'Erro', message: err.message || 'Falha ao inscrever.' });
      }
    };

    window.cancelar = async (id) => {
      openConfirmModal({
        title: 'Cancelar inscricao',
        message: 'Digite CONFIRMAR para cancelar.',
        confirmText: 'CONFIRMAR',
        onConfirm: async () => {
          try {
            await api(`/aluno/inscricoes/${id}`, { method: 'DELETE' });
            showToast({ type: 'success', title: 'Cancelado', message: 'Inscricao cancelada.' });
            carregar();
          } catch (err) {
            showToast({ type: 'error', title: 'Erro', message: err.message || 'Falha ao cancelar.' });
          }
        }
      });
    };

    carregar();
  </script>
</body>
</html>
