<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IFRO Esportes - Sumula Mobile</title>
  <link rel="icon" type="image/png" href="assets/ifro.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/light-override.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300,0,0" rel="stylesheet" />
</head>
<body data-page="sumula-mobile" data-theme="light">
  <div class="login-shell">
    <div class="login-card">
      <div>
        <div class="page-title">Sumula Mobile</div>
        <div class="page-subtitle">Atualize o placar rapidamente.</div>
      </div>
      <div class="form-group">
        <label>Jogo</label>
        <select id="sumulaJogo"></select>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Placar A</label>
          <input id="sumulaPlacarA" type="number" />
        </div>
        <div class="form-group">
          <label>Placar B</label>
          <input id="sumulaPlacarB" type="number" />
        </div>
      </div>
      <button class="btn-primary" onclick="salvarSumulaResultado()">Salvar placar</button>
      <div id="resultadosLista" class="form-grid"></div>
    </div>
  </div>
  <script src="js/jsdosistema.js"></script>
</body>
</html>
