<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IFRO Esportes - Sumula Mobile</title>
  <link rel="icon" type="image/png" href="/assets/ifro.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/light-override.css" />
  <link rel="stylesheet" href="/assets/success-feedback.css" />
  <script defer src="/assets/success-feedback.js"></script>
  <link rel="stylesheet" href="/css/dark-theme.css" />
</head>
<body data-page="sumula-mobile" data-theme="dark">
  <div class="login-shell">
    <div class="login-card">
      <div>
        <div class="page-title">Sumula Mobile</div>
        <div class="page-subtitle">Atualize o placar rapidamente.</div>
      </div>
      <div class="form-group">
        <label>Jogo</label>
        <select id="sumulaJogo"></select>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Placar A</label>
          <input id="sumulaPlacarA" type="number" />
        </div>
        <div class="form-group">
          <label>Placar B</label>
          <input id="sumulaPlacarB" type="number" />
        </div>
      </div>
      <button class="btn-primary" onclick="salvarSumulaResultado()">Salvar placar</button>
      <div id="resultadosLista" class="form-grid"></div>
    </div>
  </div>
  <script src="/js/jsdosistema.js"></script>
  <script defer src="/js/global-footer.js"></script>
</body>
</html>
