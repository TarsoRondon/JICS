<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Página não encontrada</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'DM Sans', sans-serif;
            background: #f4f7f6;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .card {
            background: #fff;
            padding: 60px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .08);
        }
        
        .code {
            font-size: 90px;
            font-weight: 700;
            color: #24b371;
        }
        
        .title {
            font-size: 26px;
            margin-top: 10px;
        }
        
        .desc {
            color: #6b9080;
            margin: 15px 0 30px;
        }
        
        .btn {
            padding: 12px 26px;
            border-radius: 10px;
            background: #24b371;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="code">404</div>
        <div class="title">Página não encontrada</div>
        <div class="desc">A página que você tentou acessar não existe.</div>
        <a href="index.html" class="btn">Voltar ao login</a>
    </div>
</body>

</html>
