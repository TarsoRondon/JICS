<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IFRO Esportes - Suporte</title>
  <link rel="icon" type="image/png" href="/assets/ifro.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/light-override.css" />
  <link rel="stylesheet" href="/css/dark-theme.css" />
</head>
<body data-page="suporte" data-theme="dark">
  <div id="appShell">
    <nav class="navbar">
      <div class="navbar-left">
        <button class="navbar-brand" onclick="scrollToTop()">IFRO ESPORTES</button>
      </div>
      <div class="navbar-right">
        <div class="user-menu">
          <button class="user-trigger" onclick="toggleUserDrawer()">
            <span id="userNameNavbar" class="user-name"></span>
            <img id="userAvatar" class="user-avatar" src="/assets/avatar-default.png" alt="Avatar" onerror="this.src='/assets/avatar-default.png'">
          </button>
        </div>
      </div>
    </nav>

    <main class="page">
      <section class="page-header">
        <div>
          <div class="page-title">Suporte</div>
          <div class="page-subtitle">Precisa de ajuda? Fale com a equipe.</div>
        </div>
      </section>
      <section class="card">
        <div class="form-grid">
          <div>
            <strong>Email:</strong> suporte@ifro.edu.br
          </div>
          <div>
            <strong>Horario:</strong> Segunda a sexta, 08h - 18h
          </div>
          <div>
            <strong>Telefone:</strong> (69) 0000-0000
          </div>
        </div>
      </section>
      <a class="btn-link" href="index.html">Voltar ao login</a>
    </main>

    <div id="globalModals"></div>
  </div>

  <script src="/js/jsdosistema.js"></script>
  <script defer src="/js/global-footer.js"></script>
</body>
</html>
