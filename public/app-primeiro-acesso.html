<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JICS - Primeiro acesso</title>
  <link rel="icon" type="image/png" href="assets/ifro.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/light-override.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300,0,0" rel="stylesheet" />
</head>
<body data-theme="light">
  <div class="login-shell">
    <div class="login-card" style="width: min(720px, 92vw);">
      <div>
        <div class="page-title">Primeiro acesso / OTP</div>
        <div class="page-subtitle">Recupere sua senha em tres etapas.</div>
      </div>

      <div class="form-row" style="grid-template-columns: repeat(3, minmax(0,1fr));">
        <div id="stepBadge1" class="badge badge-blue">1. Dados</div>
        <div id="stepBadge2" class="badge">2. Codigo</div>
        <div id="stepBadge3" class="badge">3. Nova senha</div>
      </div>

      <section id="step1">
        <div class="form-grid">
          <div class="form-group">
            <label>Matricula</label>
            <input id="paMatricula" placeholder="Digite sua matricula" />
            <small id="paMatriculaHelp" class="muted"></small>
          </div>
          <div class="form-group">
            <label>Email pessoal</label>
            <input id="paEmail" type="email" placeholder="seu@email.com" />
            <small id="paEmailHelp" class="muted"></small>
          </div>
          <button id="btnEnviarOtp" class="btn-primary">Enviar codigo</button>
        </div>
      </section>

      <section id="step2" class="hidden">
        <div class="form-grid">
          <div class="form-group">
            <label>Codigo OTP</label>
            <div class="form-row" style="grid-template-columns: repeat(6, 1fr);">
              <input class="otp-input" maxlength="1" inputmode="numeric" />
              <input class="otp-input" maxlength="1" inputmode="numeric" />
              <input class="otp-input" maxlength="1" inputmode="numeric" />
              <input class="otp-input" maxlength="1" inputmode="numeric" />
              <input class="otp-input" maxlength="1" inputmode="numeric" />
              <input class="otp-input" maxlength="1" inputmode="numeric" />
            </div>
            <small id="paOtpHelp" class="muted"></small>
          </div>
          <button id="btnValidarOtp" class="btn-primary">Validar</button>
        </div>
      </section>

      <section id="step3" class="hidden">
        <div class="form-grid">
          <div class="form-group">
            <label>Nova senha</label>
            <input id="newSenha" type="password" />
          </div>
          <div class="form-group">
            <label>Confirmar senha</label>
            <input id="confirmSenha" type="password" />
          </div>
          <div class="password-ux">
            <div id="rulesPrimeiro" class="password-rules">
              <div class="password-rule rule-bad" data-rule="length"><span class="rule-icon"></span> minimo 8 caracteres</div>
              <div class="password-rule rule-bad" data-rule="upper"><span class="rule-icon"></span> pelo menos 1 letra maiuscula</div>
              <div class="password-rule rule-bad" data-rule="number"><span class="rule-icon"></span> pelo menos 1 numero</div>
              <div class="password-rule rule-bad" data-rule="symbol"><span class="rule-icon"></span> pelo menos 1 simbolo</div>
            </div>
            <div class="password-strength">
              <div class="strength-bar"><span id="strengthBarPrimeiro" class="strength-fill"></span></div>
              <div id="strengthTextPrimeiro" class="strength-text">Forca: fraca</div>
            </div>
            <div id="matchPrimeiro" class="password-match match-bad">Senhas conferem</div>
          </div>
          <button id="btnSalvar" class="btn-primary btn-disabled" disabled>Salvar e entrar</button>
        </div>
      </section>

      <a class="btn-link" href="app-login.html">Voltar ao login</a>
    </div>
  </div>

  <script src="ui-kit.js"></script>
  <script src="js/password-ux.js"></script>
  <script>
    const step1 = document.getElementById('step1');
    const step2 = document.getElementById('step2');
    const step3 = document.getElementById('step3');

    function setStep(idx) {
      step1.classList.toggle('hidden', idx !== 1);
      step2.classList.toggle('hidden', idx !== 2);
      step3.classList.toggle('hidden', idx !== 3);
      document.getElementById('stepBadge1').className = `badge ${idx === 1 ? 'badge-blue' : ''}`;
      document.getElementById('stepBadge2').className = `badge ${idx === 2 ? 'badge-blue' : ''}`;
      document.getElementById('stepBadge3').className = `badge ${idx === 3 ? 'badge-blue' : ''}`;
    }

    function setError(input, help, msg) {
      help.textContent = msg || '';
      input.classList.toggle('input-erro', Boolean(msg));
    }

    async function api(url, options) {
      showLoading(true);
      try {
        const res = await fetch(url, { credentials: 'include', ...(options || {}) });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || data.sucesso === false) throw new Error(data?.erro?.mensagem || 'Erro');
        return data;
      } finally {
        showLoading(false);
      }
    }

    document.getElementById('btnEnviarOtp').addEventListener('click', async () => {
      const matricula = document.getElementById('paMatricula').value.trim();
      const email = document.getElementById('paEmail').value.trim();
      const matriculaHelp = document.getElementById('paMatriculaHelp');
      const emailHelp = document.getElementById('paEmailHelp');

      setError(document.getElementById('paMatricula'), matriculaHelp, matricula ? '' : 'Matricula obrigatoria.');
      setError(document.getElementById('paEmail'), emailHelp, /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) ? '' : 'Email invalido.');
      if (!matricula || !email) return;

      try {
        await api('/auth/aluno/otp/enviar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ matricula, email_pessoal: email })
        });
        localStorage.setItem('pa_matricula', matricula);
        localStorage.setItem('pa_email', email);
        showToast({ type: 'success', title: 'Codigo enviado', message: 'Verifique seu email.' });
        setStep(2);
      } catch (err) {
        showToast({ type: 'error', title: 'Erro', message: err.message || 'Falha ao enviar OTP.' });
      }
    });

    function getOtpValue() {
      return Array.from(document.querySelectorAll('.otp-input')).map(i => i.value).join('');
    }

    document.querySelectorAll('.otp-input').forEach((input, index, list) => {
      input.addEventListener('input', (e) => {
        input.value = input.value.replace(/\D/g, '').slice(0, 1);
        if (input.value && list[index + 1]) list[index + 1].focus();
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !input.value && list[index - 1]) {
          list[index - 1].focus();
        }
      });
    });

    document.getElementById('btnValidarOtp').addEventListener('click', async () => {
      const otp = getOtpValue();
      const help = document.getElementById('paOtpHelp');
      help.textContent = otp.length === 6 ? '' : 'Informe o codigo completo.';
      if (otp.length !== 6) return;

      try {
        const matricula = localStorage.getItem('pa_matricula');
        const data = await api('/auth/aluno/otp/validar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ matricula, otp })
        });
        localStorage.setItem('pa_reset_token', data.reset_token || data.resetToken || '');
        showToast({ type: 'success', title: 'Codigo validado', message: 'Crie sua nova senha.' });
        setStep(3);
        if (window.setupPasswordUX) {
          window.setupPasswordUX({
            passwordId: 'newSenha',
            confirmId: 'confirmSenha',
            buttonId: 'btnSalvar',
            rulesId: 'rulesPrimeiro',
            strengthBarId: 'strengthBarPrimeiro',
            strengthTextId: 'strengthTextPrimeiro',
            matchId: 'matchPrimeiro'
          });
        }
      } catch (err) {
        showToast({ type: 'error', title: 'Erro', message: err.message || 'Codigo invalido.' });
      }
    });

    document.getElementById('btnSalvar').addEventListener('click', async () => {
      const matricula = localStorage.getItem('pa_matricula');
      const resetToken = localStorage.getItem('pa_reset_token');
      const senha = document.getElementById('newSenha').value;
      if (!matricula || !resetToken) {
        showToast({ type: 'error', title: 'Erro', message: 'Sessao expirada. Refaca o processo.' });
        setStep(1);
        return;
      }
      try {
        await api('/auth/aluno/definir-senha', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ matricula, reset_token: resetToken, nova_senha: senha })
        });
        showToast({ type: 'success', title: 'Senha criada', message: 'Voce ja pode entrar.' });
        setTimeout(() => { window.location.href = 'app-dashboard.html'; }, 600);
      } catch (err) {
        showToast({ type: 'error', title: 'Erro', message: err.message || 'Falha ao salvar senha.' });
      }
    });

    setStep(1);
  </script>
</body>
</html>
