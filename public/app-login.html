<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JICS - Login do Aluno</title>
  <link rel="icon" type="image/png" href="assets/ifro.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/light-override.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300,0,0" rel="stylesheet" />
</head>
<body data-theme="light">
  <div class="login-shell">
    <form id="loginForm" class="login-card">
      <div class="center">
        <div class="card-icon"><span class="material-symbols-outlined">sports</span></div>
        <div class="page-title">IFRO Esportes</div>
        <div class="page-subtitle">Acesso do aluno</div>
      </div>

      <div id="loginError" class="page-subtitle"></div>

      <div class="form-group">
        <label for="matricula">Matricula</label>
        <input id="matricula" type="text" placeholder="Digite sua matricula" />
        <small id="matriculaHelp" class="muted"></small>
      </div>

      <div class="form-group">
        <label for="senha">Senha</label>
        <div class="form-row" style="grid-template-columns: 1fr auto; align-items:center;">
          <input id="senha" type="password" />
          <button type="button" class="icon-btn" id="toggleSenha" aria-label="Mostrar senha">
            <span class="material-symbols-outlined">visibility</span>
          </button>
        </div>
        <small id="senhaHelp" class="muted"></small>
      </div>

      <button id="btnEntrar" type="submit" class="btn-primary">Entrar</button>
      <a class="btn-link" href="app-primeiro-acesso.html">Primeiro acesso / Esqueci a senha</a>
    </form>
  </div>

  <script src="ui-kit.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const matriculaInput = document.getElementById('matricula');
    const senhaInput = document.getElementById('senha');
    const matriculaHelp = document.getElementById('matriculaHelp');
    const senhaHelp = document.getElementById('senhaHelp');
    const loginError = document.getElementById('loginError');
    const btnEntrar = document.getElementById('btnEntrar');

    document.getElementById('toggleSenha').addEventListener('click', () => {
      senhaInput.type = senhaInput.type === 'password' ? 'text' : 'password';
    });

    function setError(input, help, msg) {
      help.textContent = msg || '';
      input.classList.toggle('input-erro', Boolean(msg));
    }

    async function api(url, options) {
      showLoading(true);
      try {
        const res = await fetch(url, options);
        const data = await res.json().catch(() => ({}));
        if (!res.ok || data.sucesso === false) throw new Error(data?.erro?.mensagem || 'Erro');
        return data;
      } finally {
        showLoading(false);
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      loginError.textContent = '';

      const matricula = matriculaInput.value.trim();
      const senha = senhaInput.value.trim();
      setError(matriculaInput, matriculaHelp, matricula ? '' : 'Matricula obrigatoria.');
      setError(senhaInput, senhaHelp, senha ? '' : 'Senha obrigatoria.');
      if (!matricula || !senha) return;

      btnEntrar.disabled = true;
      btnEntrar.classList.add('btn-disabled');
      try {
        await api('/auth/aluno/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ matricula, senha })
        });
        showToast({ type: 'success', title: 'Login OK', message: 'Bem-vindo!' });
        setTimeout(() => { window.location.href = 'app-dashboard.html'; }, 500);
      } catch (err) {
        showToast({ type: 'error', title: 'Erro', message: err.message || 'Falha no login' });
        loginError.textContent = 'Nao foi possivel entrar. Verifique seus dados.';
      } finally {
        btnEntrar.disabled = false;
        btnEntrar.classList.remove('btn-disabled');
      }
    });
  </script>
</body>
</html>
