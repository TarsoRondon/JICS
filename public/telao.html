<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IFRO Esportes - Telao</title>
  <link rel="icon" type="image/png" href="/assets/ifro.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/light-override.css" />
  <link rel="stylesheet" href="/assets/success-feedback.css" />
  <script defer src="/assets/success-feedback.js"></script>
  <link rel="stylesheet" href="/css/dark-theme.css" />
</head>
<body data-theme="dark">
  <div class="telao-shell">
    <header class="telao-header">
      <div>
        <div class="telao-title">IFRO Esportes - Telao</div>
        <div class="telao-subtitle">Atualizacao em tempo real</div>
      </div>
      <div id="telaoStatus" class="telao-status">Conectando...</div>
    </header>

    <div class="telao-grid">
      <section class="telao-section">
        <h2>Em andamento</h2>
        <div id="emAndamento" class="telao-list"></div>
      </section>

      <section class="telao-section">
        <h2>Proximos jogos</h2>
        <div id="proximosJogos" class="telao-list"></div>
        <h2 style="margin-top:18px;">Ultimos resultados</h2>
        <div id="ultimosJogos" class="telao-list"></div>
      </section>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="ui-kit.js"></script>
  <script src="telao.js"></script>
  <script defer src="/js/global-footer.js"></script>
</body>
</html>
