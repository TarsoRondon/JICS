<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IFRO Esportes - Telao</title>
  <link rel="icon" type="image/png" href="assets/ifro.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/light-override.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300,0,0" rel="stylesheet" />
</head>
<body>
  <div class="telao-shell">
    <header class="telao-header">
      <div>
        <div class="telao-title">IFRO Esportes - Telao</div>
        <div class="telao-subtitle">Atualizacao em tempo real</div>
      </div>
      <div id="telaoStatus" class="telao-status">Conectando...</div>
    </header>

    <div class="telao-grid">
      <section class="telao-section">
        <h2>Em andamento</h2>
        <div id="emAndamento" class="telao-list"></div>
      </section>

      <section class="telao-section">
        <h2>Proximos jogos</h2>
        <div id="proximosJogos" class="telao-list"></div>
        <h2 style="margin-top:18px;">Ultimos resultados</h2>
        <div id="ultimosJogos" class="telao-list"></div>
      </section>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="ui-kit.js"></script>
  <script src="telao.js"></script>
</body>
</html>
