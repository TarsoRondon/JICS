<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Ranking</title>
  <link rel="icon" type="image/png" href="assets/ifro.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/light-override.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300,0,0" rel="stylesheet" />
</head>
<body data-theme="light">
  <div id="appShell">
    <nav class="navbar">
      <div class="navbar-left">
        <button class="icon-btn nav-hamburger" onclick="toggleSideNav()" aria-label="Abrir menu">
          <span class="material-symbols-outlined">menu</span>
        </button>
        <div>
          <div class="page-title">Ranking</div>
          <div class="page-subtitle">Classificacao por chave</div>
        </div>
      </div>
      <div class="navbar-right">
        <button class="btn-outline" onclick="toggleTheme()">Tema</button>
      </div>
    </nav>

    <div class="app-body">
      <aside id="sideNav" class="side-drawer">
        <div class="side-header">JICS Admin</div>
        <a class="side-link" href="admin-sorteio.html">Sorteio</a>
        <a class="side-link" href="admin-sumula.html">Sumula</a>
        <a class="side-link active" href="admin-ranking.html">Ranking</a>
        <a class="side-link" href="admin-admins.html">Administradores</a>
      </aside>

      <main class="page">
        <section class="card">
          <div class="form-row">
            <div class="form-group">
              <label>Evento</label>
              <select id="eventoSelect">
                <option value="">Evento</option>
              </select>
            </div>
            <div class="form-group">
              <label>Modalidade</label>
              <select id="modalidadeSelect">
                <option value="">Modalidade</option>
              </select>
            </div>
            <div class="form-group">
              <label>Sexo</label>
              <select id="sexoSelect">
                <option value="">Sexo</option>
                <option value="M">Masculino</option>
                <option value="F">Feminino</option>
              </select>
            </div>
            <div class="form-group" style="align-self:end;">
              <button id="btnAtualizar" class="btn-primary">Atualizar</button>
            </div>
          </div>
        </section>

        <section class="card">
          <div id="tabs" class="admin-tabs" style="margin-bottom:12px;"></div>
          <div id="rankingTable"></div>
        </section>
      </main>
    </div>

    <div id="sideOverlay" class="overlay"></div>
  </div>

  <script src="ui-kit.js"></script>
  <script>
    const sideNav = document.getElementById('sideNav');
    const sideOverlay = document.getElementById('sideOverlay');

    function toggleSideNav() {
      sideNav.classList.toggle('open');
      sideOverlay.classList.toggle('active');
    }

    sideOverlay.addEventListener('click', () => {
      sideNav.classList.remove('open');
      sideOverlay.classList.remove('active');
    });

    async function fetchEventos() {
      try {
        const res = await fetch('/eventos', { credentials: 'include' });
        const data = await res.json();
        if (!data.sucesso) throw new Error();
        const select = document.getElementById('eventoSelect');
        (data.data || []).forEach(e => {
          const opt = document.createElement('option');
          opt.value = e.id;
          opt.textContent = `${e.nome} (${e.ano})`;
          select.appendChild(opt);
        });
      } catch {
        showToast({ type: 'warning', title: 'Aviso', message: 'Nao foi possivel carregar eventos.' });
      }
    }

    async function fetchModalidades() {
      try {
        const res = await fetch('/modalidades');
        const data = await res.json();
        const select = document.getElementById('modalidadeSelect');
        (data || []).forEach(m => {
          const opt = document.createElement('option');
          opt.value = m.id;
          opt.textContent = m.titulo || m.nome;
          select.appendChild(opt);
        });
      } catch {
        showToast({ type: 'warning', title: 'Aviso', message: 'Nao foi possivel carregar modalidades.' });
      }
    }

    function renderSkeleton() {
      const container = document.getElementById('rankingTable');
      container.innerHTML = `
        <div class="skeleton-card">
          ${Array.from({ length: 6 }).map(() => `<div class="skeleton-line"></div>`).join('')}
        </div>
      `;
    }

    function renderTabs(chaves, active, onClick) {
      const tabs = document.getElementById('tabs');
      tabs.innerHTML = chaves.map(c => `
        <button class="admin-tab ${c === active ? 'active' : ''}" data-chave="${c}">${c}</button>
      `).join('');
      tabs.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', () => onClick(btn.dataset.chave));
      });
    }

    function renderTabela(chave, data) {
      const container = document.getElementById('rankingTable');
      const rows = data[chave] || [];
      if (!rows.length) {
        container.innerHTML = `<div class="muted">Nenhum dado para ${chave}.</div>`;
        return;
      }
      container.innerHTML = `
        <div class="table-responsive">
          <table class="table">
            <thead>
              <tr>
                <th>Equipe</th>
                <th>Pontos</th>
                <th>Vitorias</th>
                <th>Empates</th>
                <th>Derrotas</th>
                <th>Saldo</th>
                <th>Jogos</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map(r => `
                <tr>
                  <td>${r.equipe}</td>
                  <td>${r.pontos}</td>
                  <td>${r.vitorias}</td>
                  <td>${r.empates}</td>
                  <td>${r.derrotas}</td>
                  <td>${r.saldo}</td>
                  <td>${r.jogos}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    async function fetchRanking() {
      const eventoId = document.getElementById('eventoSelect').value;
      const modalidadeId = document.getElementById('modalidadeSelect').value;
      const sexo = document.getElementById('sexoSelect').value;
      if (!eventoId || !modalidadeId || !sexo) {
        showToast({ type: 'warning', title: 'Atencao', message: 'Selecione evento, modalidade e sexo.' });
        return;
      }
      renderSkeleton();
      try {
        const res = await fetch(`/ranking/${eventoId}/${modalidadeId}/${sexo}`, { credentials: 'include' });
        const data = await res.json();
        if (!data.sucesso) throw new Error(data?.erro?.mensagem || 'Erro');
        const ranking = data.data || {};
        const chaves = Object.keys(ranking);
        if (!chaves.length) {
          document.getElementById('rankingTable').innerHTML = '<div class="muted">Sem ranking disponivel.</div>';
          document.getElementById('tabs').innerHTML = '';
          return;
        }
        let active = chaves[0];
        renderTabs(chaves, active, (c) => {
          active = c;
          renderTabs(chaves, active, renderTabela.bind(null, active, ranking));
          renderTabela(active, ranking);
        });
        renderTabela(active, ranking);
      } catch (err) {
        showToast({ type: 'error', title: 'Erro', message: err.message || 'Falha ao carregar ranking.' });
      }
    }

    document.getElementById('btnAtualizar').addEventListener('click', fetchRanking);

    fetchEventos();
    fetchModalidades();
  </script>
</body>
</html>
