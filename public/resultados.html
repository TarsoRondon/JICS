<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300,0,0" rel="stylesheet" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IFRO Esportes - Resultados</title>
  <link rel="icon" type="image/png" href="/assets/ifro.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/light-override.css" />
  <link rel="stylesheet" href="/css/dark-theme.css" />
</head>
<body data-page="resultados" data-theme="dark">
  <div id="appShell">
    <nav class="navbar">
      <div class="navbar-left">
        <button class="icon-btn nav-hamburger" onclick="toggleSideNav()"><span class="material-symbols-outlined">menu</span></button>
        <button class="navbar-brand" onclick="scrollToTop()">IFRO ESPORTES</button>
        <div class="navbar-links">
          <a class="nav-link" href="dashboard.html">Início</a>
          <a class="nav-link" href="modalidades.html">Modalidades</a>
          <a class="nav-link" href="horarios.html">Horários</a>
          <a class="nav-link" href="inscricoes.html">Inscrições</a>
          <a class="nav-link" href="noticias.html">Notícias</a>
        </div>
      </div>
      <div class="navbar-right">
        <button class="icon-btn help-btn" onclick="toggleHelpPanel()"><span class="material-symbols-outlined">help</span></button>
        <div class="user-menu">
          <button class="user-trigger" onclick="toggleUserDrawer()">
            <span id="userNameNavbar" class="user-name"></span>
            <img id="userAvatar" class="user-avatar" src="/assets/avatar-default.png" alt="Avatar" onerror="this.src='/assets/avatar-default.png'">
          </button>
        </div>
      </div>
    </nav>

    <div class="app-body">
      <aside id="sideNav" class="side-drawer">
        <div class="side-header">Menu</div>
        <a class="side-link" href="dashboard.html">Início</a>
        <a class="side-link" href="inscricoes.html">Inscrições</a>
        <a class="side-link" href="modalidades.html">Modalidades</a>
        <a class="side-link" href="noticias.html">Notícias</a>
        <a class="side-link" href="horarios.html">Horários</a>
        <a class="side-link" href="resultados.html">Resultados</a>
        <a class="side-link" href="perfil.html">Perfil</a>
      </aside>

      <main class="page">
        <section class="page-header">
          <div>
            <div class="page-title">Resultados</div>
            <div class="page-subtitle">Filtre e acompanhe partidas finalizadas.</div>
          </div>
          <button class="btn-outline" onclick="baixarResultados()">Baixar CSV</button>
        </section>

        <section class="card filter-bar">
          <div class="form-row">
            <div class="form-group">
              <label>Buscar</label>
              <input id="filtroBusca" type="text" placeholder="Equipe ou modalidade" />
            </div>
            <div class="form-group">
              <label>Modalidade</label>
              <select id="filtroModalidade"></select>
            </div>
            <div class="form-group">
              <label>Fase</label>
              <select id="filtroFase"></select>
            </div>
            <div class="form-group">
              <label>Sexo</label>
              <select id="filtroSexo">
                <option value="">Todos</option>
                <option value="M">Masculino</option>
                <option value="F">Feminino</option>
              </select>
            </div>
            <div class="form-group">
              <label>Etapa</label>
              <select id="filtroEtapa"></select>
            </div>
          </div>
          <div class="form-row" style="margin-top:12px;">
            <button class="btn-primary" onclick="filtrarResultados()">Aplicar filtros</button>
          </div>
        </section>

        <section class="card">
          <div id="listaResultados" class="form-grid"></div>
        </section>

        <section class="card">
          <div class="page-title">Ranking rapido</div>
          <div id="classificationTable" class="form-grid"></div>
        </section>
      </main>
    </div>
<div id="sideOverlay" class="overlay"></div>
    <div id="drawerOverlay" class="overlay"></div>
    <div id="userDrawer" class="user-drawer"></div>
    <div id="globalModals"></div>
  </div>

  <script src="js/jsdosistema.js"></script>
  <script defer src="/js/global-footer.js"></script>
</body>
</html>
