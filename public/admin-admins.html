<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Administradores</title>
  <link rel="icon" type="image/png" href="assets/ifro.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/light-override.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300,0,0" rel="stylesheet" />
</head>
<body data-theme="light">
  <div id="appShell">
    <nav class="navbar">
      <div class="navbar-left">
        <button class="icon-btn nav-hamburger" onclick="toggleSideNav()" aria-label="Abrir menu">
          <span class="material-symbols-outlined">menu</span>
        </button>
        <div>
          <div class="page-title">Administradores</div>
          <div class="page-subtitle">Gerencie usuarios administrativos</div>
        </div>
      </div>
      <div class="navbar-right">
        <button class="btn-outline" onclick="toggleTheme()">Tema</button>
        <button id="logoutBtn" class="btn-danger">Sair</button>
      </div>
    </nav>

    <div class="app-body">
      <aside id="sideNav" class="side-drawer">
        <div class="side-header">JICS Admin</div>
        <a class="side-link active" href="admin-admins.html">Administradores</a>
        <a class="side-link" href="admin-logs.html">Logs</a>
        <a class="side-link" href="admin-sorteio.html">Sorteio</a>
        <a class="side-link" href="admin-sumula.html">Sumula</a>
        <a class="side-link" href="admin-ranking.html">Ranking</a>
      </aside>

      <main class="page">
        <section class="card">
          <div class="form-row">
            <div class="form-group">
              <label>Buscar nome/email</label>
              <input id="searchInput" placeholder="Digite nome ou email" />
            </div>
            <div class="form-group">
              <label>Role</label>
              <select id="roleFilter">
                <option value="">Todos</option>
                <option value="SUPER_ADMIN">SUPER_ADMIN</option>
                <option value="ADMIN">ADMIN</option>
                <option value="STAFF">STAFF</option>
              </select>
            </div>
            <div class="form-group">
              <label>Status</label>
              <select id="activeFilter">
                <option value="">Todos</option>
                <option value="1">Ativos</option>
                <option value="0">Inativos</option>
              </select>
            </div>
            <div class="form-group" style="align-self:end;">
              <div style="display:flex; gap:10px; flex-wrap:wrap;">
                <button id="applyFilter" class="btn-primary">Aplicar</button>
                <button id="openCreate" class="btn-outline">Novo admin</button>
              </div>
            </div>
          </div>
        </section>

        <section class="card">
          <div class="table-responsive">
            <table class="table">
              <thead>
                <tr>
                  <th>Nome</th>
                  <th>Email</th>
                  <th>Role</th>
                  <th>Ativo</th>
                  <th>Criado em</th>
                  <th>Acoes</th>
                </tr>
              </thead>
              <tbody id="adminsTable"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <div id="sideOverlay" class="overlay"></div>
  </div>

  <!-- Modal Create -->
  <div id="createModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Novo administrador</h3>
        <button class="icon-btn" onclick="closeModal('createModal')"><span class="material-symbols-outlined">close</span></button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Nome</label>
          <input id="createNome" />
          <small id="createNomeHelp" class="muted"></small>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input id="createEmail" type="email" />
          <small id="createEmailHelp" class="muted"></small>
        </div>
        <div class="form-group">
          <label>Senha</label>
          <input id="createSenha" type="password" />
          <small id="createSenhaHelp" class="muted"></small>
        </div>
        <div class="form-group">
          <label>Role</label>
          <select id="createRole">
            <option value="STAFF">STAFF</option>
            <option value="ADMIN">ADMIN</option>
            <option value="SUPER_ADMIN">SUPER_ADMIN</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-outline" onclick="closeModal('createModal')">Cancelar</button>
        <button class="btn-primary" onclick="createAdmin()">Criar</button>
      </div>
    </div>
  </div>

  <!-- Modal Edit -->
  <div id="editModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Editar administrador</h3>
        <button class="icon-btn" onclick="closeModal('editModal')"><span class="material-symbols-outlined">close</span></button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Nome</label>
          <input id="editNome" />
          <small id="editNomeHelp" class="muted"></small>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input id="editEmail" disabled />
        </div>
        <div class="form-group">
          <label>Role</label>
          <select id="editRole">
            <option value="STAFF">STAFF</option>
            <option value="ADMIN">ADMIN</option>
            <option value="SUPER_ADMIN">SUPER_ADMIN</option>
          </select>
        </div>
        <div class="form-group">
          <label>Ativo</label>
          <select id="editAtivo">
            <option value="1">Ativo</option>
            <option value="0">Inativo</option>
          </select>
        </div>
        <div class="form-group">
          <label>Nova senha (opcional)</label>
          <div class="form-row" style="grid-template-columns: 1fr auto; align-items:center;">
            <input id="editSenha" type="password" />
            <button class="btn-outline" onclick="resetTempPassword()">Resetar senha</button>
          </div>
          <small id="editSenhaHelp" class="muted"></small>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-outline" onclick="closeModal('editModal')">Cancelar</button>
        <button class="btn-primary" onclick="saveEditAdmin()">Salvar</button>
      </div>
    </div>
  </div>

  <script src="ui-kit.js"></script>
  <script>
    const sideNav = document.getElementById('sideNav');
    const sideOverlay = document.getElementById('sideOverlay');

    function toggleSideNav() {
      sideNav.classList.toggle('open');
      sideOverlay.classList.toggle('active');
    }

    sideOverlay.addEventListener('click', () => {
      sideNav.classList.remove('open');
      sideOverlay.classList.remove('active');
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      openConfirmModal({
        title: 'Sair do sistema',
        message: 'Digite CONFIRMAR para encerrar a sessao.',
        confirmText: 'CONFIRMAR',
        onConfirm: async () => {
          await fetch('/auth/admin/logout', { method: 'POST', credentials: 'include' });
          window.location.href = 'admin-login.html';
        }
      });
    });

    let admins = [];
    let editingId = null;

    function openModal(id) {
      document.getElementById(id).classList.remove('hidden');
    }
    function closeModal(id) {
      document.getElementById(id).classList.add('hidden');
    }

    function setHelp(inputId, helpId, msg) {
      const input = document.getElementById(inputId);
      const help = document.getElementById(helpId);
      if (!input || !help) return;
      help.textContent = msg || '';
      input.classList.toggle('input-erro', Boolean(msg));
    }

    function formatDate(dateStr) {
      if (!dateStr) return '-';
      return new Date(dateStr).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
    }

    function renderAdmins(list) {
      const tbody = document.getElementById('adminsTable');
      if (!list.length) {
        tbody.innerHTML = `<tr><td colspan="6" class="center muted" style="padding:18px;">Nenhum administrador encontrado.</td></tr>`;
        return;
      }
      tbody.innerHTML = list.map(a => `
        <tr>
          <td>${a.nome}</td>
          <td>${a.email}</td>
          <td>${a.role}</td>
          <td>${a.ativo ? 'Sim' : 'Nao'}</td>
          <td>${formatDate(a.criado_em)}</td>
          <td>
            <button class="btn-link" onclick="openEdit(${a.id})">Editar</button>
            <button class="btn-link" onclick="toggleAtivo(${a.id})">${a.ativo ? 'Desativar' : 'Ativar'}</button>
            <button class="btn-link" onclick="deleteAdmin(${a.id})">Excluir</button>
          </td>
        </tr>
      `).join('');
    }

    async function fetchAdmins() {
      showLoading(true);
      try {
        const res = await fetch('/admins', { credentials: 'include' });
        const data = await res.json();
        if (!data.sucesso) throw new Error(data?.erro?.mensagem || 'Erro');
        admins = data.data || [];
        applyFilters();
      } catch (err) {
        showToast({ type: 'error', title: 'Erro', message: err.message || 'Falha ao carregar admins' });
      } finally {
        showLoading(false);
      }
    }

    function applyFilters() {
      const search = document.getElementById('searchInput').value.trim().toLowerCase();
      const role = document.getElementById('roleFilter').value;
      const ativo = document.getElementById('activeFilter').value;
      let list = [...admins];
      if (search) list = list.filter(a => a.nome.toLowerCase().includes(search) || a.email.toLowerCase().includes(search));
      if (role) list = list.filter(a => a.role === role);
      if (ativo !== '') list = list.filter(a => String(a.ativo ? 1 : 0) === ativo);
      renderAdmins(list);
    }

    document.getElementById('applyFilter').addEventListener('click', applyFilters);
    document.getElementById('openCreate').addEventListener('click', () => openModal('createModal'));

    async function createAdmin() {
      const nome = document.getElementById('createNome').value.trim();
      const email = document.getElementById('createEmail').value.trim();
      const senha = document.getElementById('createSenha').value.trim();
      const role = document.getElementById('createRole').value;
      let ok = true;
      setHelp('createNome', 'createNomeHelp', nome ? '' : 'Nome obrigatorio.');
      setHelp('createEmail', 'createEmailHelp', /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) ? '' : 'Email invalido.');
      setHelp('createSenha', 'createSenhaHelp', senha.length >= 8 ? '' : 'Senha deve ter ao menos 8 caracteres.');
      if (!nome || !email || senha.length < 8) ok = false;
      if (!ok) return;

      showLoading(true);
      try {
        const res = await fetch('/admins', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ nome, email, senha, role })
        });
        const data = await res.json();
        if (!data.sucesso) throw new Error(data?.erro?.mensagem || 'Erro ao criar');
        showToast({ type: 'success', title: 'Administrador criado', message: 'Cadastro realizado com sucesso.' });
        closeModal('createModal');
        fetchAdmins();
      } catch (err) {
        showToast({ type: 'error', title: 'Erro', message: err.message || 'Falha ao criar admin' });
      } finally {
        showLoading(false);
      }
    }

    function openEdit(id) {
      const admin = admins.find(a => a.id === id);
      if (!admin) return;
      editingId = id;
      document.getElementById('editNome').value = admin.nome;
      document.getElementById('editEmail').value = admin.email;
      document.getElementById('editRole').value = admin.role;
      document.getElementById('editAtivo').value = admin.ativo ? '1' : '0';
      document.getElementById('editSenha').value = '';
      openModal('editModal');
    }

    function resetTempPassword() {
      const pass = Math.random().toString(36).slice(-10) + 'A1';
      document.getElementById('editSenha').value = pass;
      showToast({ type: 'info', title: 'Senha temporaria', message: 'Uma senha temporaria foi gerada.' });
    }

    async function saveEditAdmin() {
      const nome = document.getElementById('editNome').value.trim();
      const role = document.getElementById('editRole').value;
      const ativo = document.getElementById('editAtivo').value === '1';
      const senha = document.getElementById('editSenha').value.trim();
      setHelp('editNome', 'editNomeHelp', nome ? '' : 'Nome obrigatorio.');
      setHelp('editSenha', 'editSenhaHelp', senha && senha.length < 8 ? 'Senha deve ter ao menos 8 caracteres.' : '');
      if (!nome) return;
      if (senha && senha.length < 8) return;

      showLoading(true);
      try {
        const res = await fetch(`/admins/${editingId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ nome, role, ...(senha ? { senha } : {}) })
        });
        const data = await res.json();
        if (!data.sucesso) throw new Error(data?.erro?.mensagem || 'Erro ao atualizar');

        await fetch(`/admins/${editingId}/ativar`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ ativo })
        });
        showToast({ type: 'success', title: 'Admin atualizado', message: 'Alteracoes salvas.' });
        closeModal('editModal');
        fetchAdmins();
      } catch (err) {
        showToast({ type: 'error', title: 'Erro', message: err.message || 'Falha ao atualizar' });
      } finally {
        showLoading(false);
      }
    }

    function toggleAtivo(id) {
      const admin = admins.find(a => a.id === id);
      if (!admin) return;
      openConfirmModal({
        title: admin.ativo ? 'Desativar admin' : 'Ativar admin',
        message: 'Digite CONFIRMAR para continuar.',
        confirmText: 'CONFIRMAR',
        onConfirm: async () => {
          showLoading(true);
          try {
            const res = await fetch(`/admins/${id}/ativar`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              credentials: 'include',
              body: JSON.stringify({ ativo: !admin.ativo })
            });
            const data = await res.json();
            if (!data.sucesso) throw new Error(data?.erro?.mensagem || 'Erro');
            showToast({ type: 'success', title: 'Atualizado', message: 'Status alterado.' });
            fetchAdmins();
          } catch (err) {
            showToast({ type: 'error', title: 'Erro', message: err.message || 'Falha ao atualizar status' });
          } finally {
            showLoading(false);
          }
        }
      });
    }

    function deleteAdmin(id) {
      openConfirmModal({
        title: 'Excluir administrador',
        message: 'Acao irreversivel. Digite CONFIRMAR para excluir.',
        confirmText: 'CONFIRMAR',
        onConfirm: async () => {
          showLoading(true);
          try {
            const res = await fetch(`/admins/${id}`, {
              method: 'DELETE',
              credentials: 'include'
            });
            const data = await res.json();
            if (!data.sucesso) throw new Error(data?.erro?.mensagem || 'Erro ao excluir');
            showToast({ type: 'success', title: 'Admin removido', message: 'Registro excluido.' });
            fetchAdmins();
          } catch (err) {
            showToast({ type: 'error', title: 'Erro', message: err.message || 'Falha ao excluir' });
          } finally {
            showLoading(false);
          }
        }
      });
    }

    fetchAdmins();
  </script>
</body>
</html>
