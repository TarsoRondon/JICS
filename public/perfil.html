<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300,0,0" rel="stylesheet" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IFRO Esportes - Perfil</title>
  <link rel="icon" type="image/png" href="/assets/ifro.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/light-override.css" />
</head>
<body class="no-drawer" data-page="perfil" data-theme="light">
  <div id="appShell">
    <nav class="navbar">
      <div class="navbar-left">
        <button class="icon-btn nav-hamburger" onclick="toggleSideNav()"><span class="material-symbols-outlined">menu</span></button>
        <button class="navbar-brand" onclick="scrollToTop()">IFRO ESPORTES</button>
        <div class="navbar-links">
          <a class="nav-link" href="dashboard.html">Início</a>
          <a class="nav-link" href="modalidades.html">Modalidades</a>
          <a class="nav-link" href="horarios.html">Horários</a>
          <a class="nav-link" href="inscricoes.html">Inscrições</a>
          <a class="nav-link" href="noticias.html">Notícias</a>
        </div>
      </div>
      <div class="navbar-right">
        <button class="icon-btn help-btn" onclick="toggleHelpPanel()"><span class="material-symbols-outlined">help</span></button>
        <div class="user-menu">
          <button class="user-trigger" onclick="toggleUserDrawer()">
            <span id="userNameNavbar" class="user-name"></span>
            <img id="userAvatar" class="user-avatar" src="/assets/avatar-default.png" alt="Avatar" onerror="this.src='/assets/avatar-default.png'">
          </button>
        </div>
      </div>
    </nav>

    <div class="app-body">
      <aside id="sideNav" class="side-drawer">
        <div class="side-header">Menu</div>
        <a class="side-link" href="dashboard.html">Início</a>
        <a class="side-link" href="inscricoes.html">Inscrições</a>
        <a class="side-link" href="modalidades.html">Modalidades</a>
        <a class="side-link" href="noticias.html">Notícias</a>
        <a class="side-link" href="horarios.html">Horários</a>
        <a class="side-link" href="resultados.html">Resultados</a>
        <a class="side-link" href="perfil.html">Perfil</a>
      </aside>

      <main class="page">
        <section class="page-header">
          <div>
            <div class="page-title">Meu perfil</div>
            <div class="page-subtitle">Seus dados cadastrais</div>
          </div>
          <div class="hero-actions">
            <button class="btn-outline" onclick="openPhotoModal()">Alterar foto</button>
            <a class="btn-primary" href="recuperacao.html#reset">Alterar senha</a>
          </div>
        </section>

        <section class="card profile-card">
          <div class="profile-grid">
            <div class="profile-item">
              <label>Nome</label>
              <div class="profile-value" id="perfilNome"></div>
            </div>
            <div class="profile-item">
              <label>Matrícula</label>
              <div class="profile-value" id="perfilMatricula"></div>
            </div>
            <div class="profile-item">
              <label>Curso</label>
              <div class="profile-value" id="perfilCurso"></div>
            </div>
            <div class="profile-item">
              <label>Turma</label>
              <div class="profile-value" id="perfilTurma"></div>
            </div>
            <div class="profile-item">
              <label>Campus</label>
              <div class="profile-value" id="perfilCampus"></div>
            </div>
            <div class="profile-item">
              <label>Data de nascimento</label>
              <div class="profile-value" id="perfilNascimento"></div>
            </div>
            <div class="profile-item">
              <label>Telefone</label>
              <div class="profile-value" id="perfilTelefone"></div>
            </div>
            <div class="profile-item">
              <label>Email acadêmico</label>
              <div class="profile-value" id="perfilEmailAcademico"></div>
            </div>
            <div class="profile-item">
              <label>Email pessoal</label>
              <div class="profile-value" id="perfilEmailPessoal"></div>
            </div>
          </div>
        </section>
      </main>
    </div>
<div id="sideOverlay" class="overlay"></div>
    <div id="drawerOverlay" class="overlay"></div>
    <div id="userDrawer" class="user-drawer"></div>
    <div id="globalModals"></div>
  </div>

  <script src="js/jsdosistema.js"></script>
</body>
</html>
