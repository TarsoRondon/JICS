<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JICS - Perfil</title>
  <link rel="icon" type="image/png" href="assets/ifro.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/light-override.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300,0,0" rel="stylesheet" />
</head>
<body data-theme="light">
  <div id="appShell">
    <nav class="navbar">
      <div class="navbar-left">
        <button class="icon-btn nav-hamburger" onclick="toggleSideNav()" aria-label="Abrir menu">
          <span class="material-symbols-outlined">menu</span>
        </button>
        <button class="navbar-brand">Perfil</button>
      </div>
      <div class="navbar-right">
        <button class="btn-outline" onclick="toggleTheme()">Tema</button>
        <button id="btnSair" class="btn-danger">Sair</button>
      </div>
    </nav>

    <div class="app-body">
      <aside id="sideNav" class="side-drawer">
        <div class="side-header">Menu</div>
        <a class="side-link" href="app-dashboard.html">Dashboard</a>
        <a class="side-link" href="app-inscricoes.html">Inscricoes</a>
        <a class="side-link" href="app-meus-jogos.html">Meus jogos</a>
        <a class="side-link" href="app-ranking.html">Ranking</a>
        <a class="side-link active" href="app-perfil.html">Perfil</a>
        <a class="side-link" href="app-ajuda.html">Ajuda</a>
      </aside>

      <main class="page with-bottom-nav">
        <section class="card">
          <div class="page-title">Meus dados</div>
          <div class="form-grid" style="margin-top:12px;">
            <div class="form-group">
              <label>Nome</label>
              <input id="perfilNome" disabled />
            </div>
            <div class="form-group">
              <label>Matricula</label>
              <input id="perfilMatricula" disabled />
            </div>
            <div class="form-group">
              <label>Turma</label>
              <input id="perfilTurma" disabled />
            </div>
            <div class="form-group">
              <label>Campus</label>
              <input id="perfilCampus" disabled />
            </div>
            <div class="form-group">
              <label>Email academico</label>
              <input id="perfilEmailAcademico" disabled />
            </div>
            <div class="form-group">
              <label>Email pessoal</label>
              <input id="perfilEmailPessoal" disabled />
            </div>
          </div>
          <div class="card-actions">
            <button class="btn-primary" onclick="openSenhaModal()">Alterar senha</button>
          </div>
        </section>
      </main>
    </div>

    <div id="sideOverlay" class="overlay"></div>

    <nav class="bottom-nav">
      <a class="bottom-link" href="app-dashboard.html">
        <span class="material-symbols-outlined">home</span>
        Dashboard
      </a>
      <a class="bottom-link" href="app-inscricoes.html">
        <span class="material-symbols-outlined">how_to_reg</span>
        Inscricoes
      </a>
      <a class="bottom-link" href="app-meus-jogos.html">
        <span class="material-symbols-outlined">sports_soccer</span>
        Jogos
      </a>
      <a class="bottom-link" href="app-ranking.html">
        <span class="material-symbols-outlined">leaderboard</span>
        Ranking
      </a>
      <a class="bottom-link active" href="app-perfil.html">
        <span class="material-symbols-outlined">person</span>
        Perfil
      </a>
    </nav>
  </div>

  <div id="senhaModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Alterar senha</h3>
        <button class="icon-btn" onclick="closeSenhaModal()"><span class="material-symbols-outlined">close</span></button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Senha atual</label>
          <input id="senhaAtual" type="password" />
        </div>
        <div class="form-group">
          <label>Nova senha</label>
          <input id="senhaNova" type="password" />
        </div>
        <div class="form-group">
          <label>Confirmar senha</label>
          <input id="confirmNewSenha" type="password" />
        </div>
        <div class="password-ux">
          <div id="rulesPerfil" class="password-rules">
            <div class="password-rule rule-bad" data-rule="length"><span class="rule-icon"></span> minimo 8 caracteres</div>
            <div class="password-rule rule-bad" data-rule="upper"><span class="rule-icon"></span> pelo menos 1 letra maiuscula</div>
            <div class="password-rule rule-bad" data-rule="number"><span class="rule-icon"></span> pelo menos 1 numero</div>
            <div class="password-rule rule-bad" data-rule="symbol"><span class="rule-icon"></span> pelo menos 1 simbolo</div>
          </div>
          <div class="password-strength">
            <div class="strength-bar"><span id="strengthBarPerfil" class="strength-fill"></span></div>
            <div id="strengthTextPerfil" class="strength-text">Forca: fraca</div>
          </div>
          <div id="matchPerfil" class="password-match match-bad">Senhas conferem</div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-outline" onclick="closeSenhaModal()">Cancelar</button>
        <button id="btnSalvarSenha" class="btn-primary btn-disabled" disabled>Salvar</button>
      </div>
    </div>
  </div>

  <script src="ui-kit.js"></script>
  <script src="js/password-ux.js"></script>
  <script>
    const sideNav = document.getElementById('sideNav');
    const sideOverlay = document.getElementById('sideOverlay');
    const senhaModal = document.getElementById('senhaModal');
    let passwordUxInstance = null;

    function toggleSideNav() {
      sideNav.classList.toggle('open');
      sideOverlay.classList.toggle('active');
    }

    sideOverlay.addEventListener('click', () => {
      sideNav.classList.remove('open');
      sideOverlay.classList.remove('active');
    });

    document.getElementById('btnSair').addEventListener('click', () => {
      openConfirmModal({
        title: 'Sair do sistema',
        message: 'Digite CONFIRMAR para sair.',
        confirmText: 'CONFIRMAR',
        onConfirm: async () => {
          await fetch('/auth/aluno/logout', { method: 'POST', credentials: 'include' });
          window.location.href = 'app-login.html';
        }
      });
    });

    function openSenhaModal() {
      senhaModal.classList.remove('hidden');
      if (passwordUxInstance) passwordUxInstance.evaluate();
    }

    function closeSenhaModal() {
      senhaModal.classList.add('hidden');
      document.getElementById('senhaAtual').value = '';
      document.getElementById('senhaNova').value = '';
      document.getElementById('confirmNewSenha').value = '';
      if (passwordUxInstance) passwordUxInstance.evaluate();
    }

    async function api(url, options) {
      showLoading(true);
      try {
        const res = await fetch(url, { credentials: 'include', ...(options || {}) });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || data.sucesso === false) throw new Error(data?.erro?.mensagem || 'Erro');
        return data.data || data;
      } finally {
        showLoading(false);
      }
    }

    async function loadPerfil() {
      try {
        const data = await api('/aluno/me', { credentials: 'include' });
        document.getElementById('perfilNome').value = data.nome || '';
        document.getElementById('perfilMatricula').value = data.matricula || '';
        document.getElementById('perfilTurma').value = data.turma || '';
        document.getElementById('perfilCampus').value = data.campus || '';
        document.getElementById('perfilEmailAcademico').value = data.email_academico || '';
        document.getElementById('perfilEmailPessoal').value = data.email_pessoal || '';
      } catch {
        showToast({ type: 'error', title: 'Erro', message: 'Nao foi possivel carregar seus dados.' });
      }
    }

    document.getElementById('btnSalvarSenha').addEventListener('click', async () => {
      const senhaAtual = document.getElementById('senhaAtual').value.trim();
      const senhaNova = document.getElementById('senhaNova').value.trim();
      if (!senhaAtual || !senhaNova) {
        showToast({ type: 'warning', title: 'Atencao', message: 'Preencha todos os campos.' });
        return;
      }
      try {
        await api('/aluno/senha', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ senha_atual: senhaAtual, nova_senha: senhaNova })
        });
        showToast({ type: 'success', title: 'Senha atualizada', message: 'Sua senha foi alterada.' });
        closeSenhaModal();
      } catch (err) {
        showToast({ type: 'error', title: 'Erro', message: err.message || 'Falha ao alterar senha.' });
      }
    });

    loadPerfil();
    if (window.setupPasswordUX) {
      passwordUxInstance = window.setupPasswordUX({
        passwordId: 'senhaNova',
        confirmId: 'confirmNewSenha',
        buttonId: 'btnSalvarSenha',
        rulesId: 'rulesPerfil',
        strengthBarId: 'strengthBarPerfil',
        strengthTextId: 'strengthTextPerfil',
        matchId: 'matchPerfil'
      });
    }
  </script>
</body>
</html>
