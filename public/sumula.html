<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300,0,0" rel="stylesheet" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IFRO Esportes - Sumula</title>
  <link rel="icon" type="image/png" href="/assets/ifro.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/light-override.css" />
</head>
<body data-page="sumula" data-theme="light">
  <div id="appShell">
    <nav class="navbar">
      <div class="navbar-left">
        <button class="icon-btn nav-hamburger" onclick="toggleSideNav()"><span class="material-symbols-outlined">menu</span></button>
        <button class="navbar-brand" onclick="scrollToTop()">IFRO ESPORTES - SUMULA</button>
      </div>
      <div class="navbar-right">
        <button class="icon-btn help-btn" onclick="toggleHelpPanel()"><span class="material-symbols-outlined">help</span></button>
        <div class="user-menu">
          <button class="user-trigger" onclick="toggleUserDrawer()">
            <span id="userNameNavbar" class="user-name"></span>
            <img id="userAvatar" class="user-avatar" src="/assets/avatar-default.png" alt="Avatar" onerror="this.src='/assets/avatar-default.png'">
          </button>
        </div>
      </div>
    </nav>

    <div class="app-body">
      <aside id="sideNav" class="side-drawer">
        <div class="side-header">Menu</div>
        <a class="side-link" href="dashboard.html">Início</a>
        <a class="side-link" href="admin.html">Admin</a>
        <a class="side-link" href="resultados.html">Resultados</a>
      </aside>

      <main class="page">
        <section class="page-header">
          <div>
            <div class="page-title">Sumula e placar</div>
            <div class="page-subtitle">Registre resultados e gere sumulas.</div>
          </div>
        </section>

        <section class="card form-grid">
          <div class="page-title">Atualizar placar rapido</div>
          <div class="form-row">
            <div class="form-group">
              <label>Jogo</label>
              <select id="sumulaJogo"></select>
            </div>
            <div class="form-group">
              <label>Placar A</label>
              <input id="sumulaPlacarA" type="number" />
            </div>
            <div class="form-group">
              <label>Placar B</label>
              <input id="sumulaPlacarB" type="number" />
            </div>
            <div class="form-group" style="align-self:end;">
              <button class="btn-primary" onclick="salvarSumulaResultado()">Salvar placar</button>
            </div>
          </div>
        </section>

        <section id="tabSumula" class="card form-grid">
          <div class="page-title">Formulario de sumula</div>
          <div class="form-row">
            <div class="form-group">
              <label>Modalidade</label>
              <select id="sumulaModalidade"></select>
            </div>
            <div class="form-group">
              <label>Sexo</label>
              <input id="sumulaSexo" />
            </div>
            <div class="form-group">
              <label>Etapa</label>
              <input id="sumulaEtapa" />
            </div>
            <div class="form-group">
              <label>Fase</label>
              <input id="sumulaFase" />
            </div>
            <div class="form-group">
              <label>Data</label>
              <input id="sumulaData" type="date" />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Equipe A</label>
              <input id="sumulaEquipeA" />
            </div>
            <div class="form-group">
              <label>Pontos A</label>
              <input id="sumulaPontosA" type="number" />
            </div>
            <div class="form-group">
              <label>Equipe B</label>
              <input id="sumulaEquipeB" />
            </div>
            <div class="form-group">
              <label>Pontos B</label>
              <input id="sumulaPontosB" type="number" />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Arbitro</label>
              <input id="sumulaArbitro" />
            </div>
            <div class="form-group">
              <label>Cartoes</label>
              <input id="sumulaCartoes" />
            </div>
            <div class="form-group">
              <label>Mesarios</label>
              <input id="sumulaMesarios" />
            </div>
            <div class="form-group">
              <label>Horario inicio</label>
              <input id="sumulaHorarioInicio" type="time" />
            </div>
            <div class="form-group">
              <label>Horario fim</label>
              <input id="sumulaHorarioFim" type="time" />
            </div>
          </div>
          <div class="form-row">
            <button class="btn-primary" onclick="gerarSumulaPreview(false)">Gerar previa</button>
            <button class="btn-outline" onclick="gerarSumulaPreview(true)">Baixar HTML</button>
          </div>
        </section>

        <section class="card">
          <div class="page-title">Resultados recentes</div>
          <div id="resultadosLista" class="form-grid"></div>
        </section>

        <section class="card">
          <div class="page-title">QR Code para sumula mobile</div>
          <div id="qrCode"></div>
        </section>
      </main>
    </div>

    <div id="sideOverlay" class="overlay"></div>
    <div id="drawerOverlay" class="overlay"></div>
    <div id="userDrawer" class="user-drawer"></div>
    <div id="globalModals"></div>
  </div>

  <script src="js/jsdosistema.js"></script>
</body>
</html>
