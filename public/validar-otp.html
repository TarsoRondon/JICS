<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IFRO Esportes - Validar código</title>
  
  
  <link rel="stylesheet" href="css/auth.css" />
<link rel="icon" type="image/png" href="/assets/ifro.png" />
  <link rel="stylesheet" href="/assets/success-feedback.css" />
  <script defer src="/assets/success-feedback.js"></script>
  <link rel="stylesheet" href="/css/dark-theme.css" />
</head>
<body class="auth-page" data-theme="dark">
  <main class="auth-shell">
    <div class="wrap">
      <section class="hero">
        <h1>Validar código</h1>
        <p>Digite o código enviado para o seu email para continuar a recuperação da senha.</p>
        <ul class="steps">
          <li><span>1</span> Informe a matrícula e o código.</li>
          <li><span>2</span> Aguarde a validação.</li>
          <li><span>3</span> Crie sua nova senha.</li>
        </ul>
      </section>

      <form id="otpVerifyForm" class="card" novalidate>
        <div class="card-header">
          <h2>Validar código</h2>
          <p>Confirme o código para liberar a redefinição.</p>
        </div>

        <fieldset class="group" aria-label="Validar código">
          <div class="group-title">Dados de verificação</div>
          <div class="field">
            <label for="matricula">Matrícula</label>
            <div class="input-wrap">
              <input id="matricula" type="text" inputmode="numeric" maxlength="13" required />
            </div>
          </div>
          <div class="field">
            <label for="otp">Código OTP</label>
            <div class="input-wrap">
              <input id="otp" type="text" inputmode="numeric" maxlength="6" required />
            </div>
          </div>
        </fieldset>

        <div class="actions">
          <button class="btn-primary" type="submit">Validar</button>
          <a class="link" href="solicitar-otp.html">Voltar</a>
        </div>
        <div id="status" class="helper" aria-live="polite"></div>
      </form>
    </div>
  </main>

  <div class="toast-stack" id="toastStack" aria-live="polite" aria-atomic="true"></div>

  <script>
    const form = document.getElementById('otpVerifyForm');
    const statusEl = document.getElementById('status');
    const matriculaInput = document.getElementById('matricula');
    const toastStack = document.getElementById('toastStack');
    const savedMatricula = localStorage.getItem('otpMatricula') || localStorage.getItem('recuperacaoMatricula');
    if (savedMatricula) matriculaInput.value = savedMatricula;

    function toast(message, type = 'success') {
      if (type === 'success' && window.SuccessFeedback && typeof window.SuccessFeedback.show === 'function') {
        window.SuccessFeedback.show({ title: 'Concluído!', message });
        return;
      }
      const t = document.createElement('div');
      t.className = `toast ${type}`;
      t.textContent = message;
      toastStack.appendChild(t);
      setTimeout(() => t.remove(), 3200);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      statusEl.textContent = 'Validando...';
      const matricula = matriculaInput.value.trim();
      const otp = document.getElementById('otp').value.trim();

      try {
        const res = await fetch('/auth/password/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ matricula, otp })
        });
        const data = await res.json();
        if (!data.sucesso) {
          statusEl.textContent = data.mensagem || 'Código inválido.';
          toast(data.mensagem || 'Código inválido.', 'error');
          return;
        }
        localStorage.setItem('resetToken', data.reset_token);
        if (matricula) localStorage.setItem('otpMatricula', matricula);
        statusEl.textContent = 'Código válido!';
        toast('Código válido!', 'success');
        setTimeout(() => { location.href = 'redefinir-senha.html'; }, 1000);
      } catch {
        statusEl.textContent = 'Erro ao validar código.';
        toast('Erro ao validar código.', 'error');
      }
    });
  </script>
  <script defer src="/js/global-footer.js"></script>
</body>
</html>
