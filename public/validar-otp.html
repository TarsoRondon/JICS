<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IFRO Esportes - Validar código</title>
  <link rel="icon" type="image/png" href="assets/ifro.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --brand-1: #00A877;
      --brand-2: #0A5D54;
      --bg: #f6fbf9;
      --card: #ffffff;
      --text: #0b1f1a;
      --muted: #56736c;
      --border: rgba(10, 93, 84, 0.12);
      --shadow: 0 18px 40px rgba(16, 60, 52, 0.12);
      --focus: rgba(0, 168, 119, 0.18);
      --danger: #d94242;
      --ok: #0f9f7c;
      --radius: 20px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #071613;
        --card: #0d1f1b;
        --text: #e8f6f2;
        --muted: #9bb7b0;
        --border: rgba(0, 168, 119, 0.18);
        --shadow: 0 18px 40px rgba(0, 0, 0, 0.4);
        --focus: rgba(0, 168, 119, 0.24);
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter", system-ui, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      min-height: 100vh;
    }

    .auth-shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 48px 20px;
    }

    .wrap {
      width: 100%;
      max-width: 820px;
      display: grid;
      gap: 24px;
    }

    .hero {
      display: grid;
      gap: 8px;
    }

    .hero h1 {
      margin: 0;
      font-size: 26px;
      letter-spacing: -0.4px;
    }

    .hero p {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
    }

    .steps {
      margin: 8px 0 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 8px;
    }

    .steps li {
      display: flex;
      gap: 10px;
      align-items: center;
      color: var(--muted);
      font-size: 13px;
    }

    .steps span {
      background: rgba(0, 168, 119, 0.15);
      color: var(--text);
      font-weight: 700;
      border-radius: 999px;
      padding: 2px 10px;
      font-size: 12px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      display: grid;
      gap: 20px;
    }

    .card-header {
      display: grid;
      gap: 6px;
    }

    .card-header h2 {
      margin: 0;
      font-size: 20px;
    }

    .card-header p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .group {
      border: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 12px;
    }

    .group-title {
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    label {
      font-size: 13px;
      font-weight: 600;
    }

    .input-wrap {
      position: relative;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border .2s, box-shadow .2s;
    }

    input:focus {
      border-color: var(--brand-1);
      box-shadow: 0 0 0 4px var(--focus);
    }

    .helper {
      font-size: 12px;
      color: var(--muted);
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn-primary {
      background: linear-gradient(140deg, var(--brand-1), var(--brand-2));
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 12px 26px rgba(0, 168, 119, 0.28);
      transition: transform .2s ease, box-shadow .2s ease, opacity .2s ease;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 30px rgba(0, 168, 119, 0.34);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .link {
      color: var(--muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
    }

    .link:hover { text-decoration: underline; }

    .toast-stack {
      position: fixed;
      right: 20px;
      bottom: 20px;
      display: grid;
      gap: 10px;
      z-index: 9999;
    }

    .toast {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 12px 14px;
      border-radius: 12px;
      box-shadow: var(--shadow);
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toast.success { border-left: 4px solid var(--ok); }
    .toast.error { border-left: 4px solid var(--danger); }

    @media (max-width: 720px) {
      .card { padding: 18px; }
      .actions { align-items: stretch; }
      .btn-primary { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="auth-shell">
    <div class="wrap">
      <section class="hero">
        <h1>Validar código</h1>
        <p>Digite o código enviado para o seu email para continuar a recuperação da senha.</p>
        <ul class="steps">
          <li><span>1</span> Informe a matrícula e o código.</li>
          <li><span>2</span> Aguarde a validação.</li>
          <li><span>3</span> Crie sua nova senha.</li>
        </ul>
      </section>

      <form id="otpVerifyForm" class="card" novalidate>
        <div class="card-header">
          <h2>Validar código</h2>
          <p>Confirme o código para liberar a redefinição.</p>
        </div>

        <fieldset class="group" aria-label="Validar código">
          <div class="group-title">Dados de verificação</div>
          <div class="field">
            <label for="matricula">Matrícula</label>
            <div class="input-wrap">
              <input id="matricula" type="text" inputmode="numeric" maxlength="13" required />
            </div>
          </div>
          <div class="field">
            <label for="otp">Código OTP</label>
            <div class="input-wrap">
              <input id="otp" type="text" inputmode="numeric" maxlength="6" required />
            </div>
          </div>
        </fieldset>

        <div class="actions">
          <button class="btn-primary" type="submit">Validar</button>
          <a class="link" href="solicitar-otp.html">Voltar</a>
        </div>
        <div id="status" class="helper" aria-live="polite"></div>
      </form>
    </div>
  </main>

  <div class="toast-stack" id="toastStack" aria-live="polite" aria-atomic="true"></div>

  <script>
    const form = document.getElementById('otpVerifyForm');
    const statusEl = document.getElementById('status');
    const matriculaInput = document.getElementById('matricula');
    const toastStack = document.getElementById('toastStack');
    const savedMatricula = localStorage.getItem('otpMatricula') || localStorage.getItem('recuperacaoMatricula');
    if (savedMatricula) matriculaInput.value = savedMatricula;

    function toast(message, type = 'success') {
      const t = document.createElement('div');
      t.className = `toast ${type}`;
      t.textContent = message;
      toastStack.appendChild(t);
      setTimeout(() => t.remove(), 3200);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      statusEl.textContent = 'Validando...';
      const matricula = matriculaInput.value.trim();
      const otp = document.getElementById('otp').value.trim();

      try {
        const res = await fetch('/auth/password/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ matricula, otp })
        });
        const data = await res.json();
        if (!data.sucesso) {
          statusEl.textContent = data.mensagem || 'Código inválido.';
          toast(data.mensagem || 'Código inválido.', 'error');
          return;
        }
        localStorage.setItem('resetToken', data.reset_token);
        if (matricula) localStorage.setItem('otpMatricula', matricula);
        statusEl.textContent = 'Código válido!';
        toast('Código válido!', 'success');
        setTimeout(() => { location.href = 'redefinir-senha.html'; }, 1000);
      } catch {
        statusEl.textContent = 'Erro ao validar código.';
        toast('Erro ao validar código.', 'error');
      }
    });
  </script>
</body>
</html>
