<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IFRO Esportes - Validar código</title>
  <link rel="icon" type="image/png" href="assets/ifro.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f6fbf9;
      --text: #0b1f1a;
      --muted: #4b6f66;
      --accent: #2ca880;
      --accent-soft: #7ad3be;
      --border: rgba(76, 111, 103, 0.16);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter", system-ui, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      min-height: 100vh;
    }
    .full-screen {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 32px;
      padding: 64px;
      align-items: center;
    }
    .message {
      max-width: 520px;
    }
    .message h1 {
      font-size: 40px;
      margin: 0 0 12px;
      letter-spacing: -1px;
    }
    .message p {
      margin: 0 0 14px;
      color: var(--muted);
    }
    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 18px 40px rgba(53, 73, 69, 0.12);
    }
    .form-grid {
      display: grid;
      gap: 14px;
      margin-top: 8px;
    }
    label {
      display: block;
      font-size: 12px;
      margin-bottom: 6px;
      color: #0b1f1a;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #f7fbf9;
      font-size: 14px;
      outline: none;
    }
    input:focus {
      border-color: rgba(44, 168, 128, .6);
      box-shadow: 0 0 0 4px rgba(44, 168, 128, .12);
    }
    .btn-primary {
      background: linear-gradient(140deg, var(--accent), var(--accent-soft));
      color: #0b1f1a;
      font-weight: 800;
      border: none;
      border-radius: 12px;
      padding: 12px 14px;
      cursor: pointer;
    }
    .status {
      font-size: 13px;
      color: var(--muted);
    }
    .link {
      margin-top: 14px;
      display: inline-block;
      color: var(--muted);
      text-decoration: none;
      font-weight: 600;
    }
    .steps {
      margin: 14px 0 0;
      padding: 0;
      list-style: none;
    }
    .steps li {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      margin-bottom: 10px;
    }
    .steps span {
      background: rgba(44, 168, 128, .15);
      color: #0b1f1a;
      font-weight: 700;
      border-radius: 999px;
      padding: 2px 10px;
      font-size: 12px;
    }
    @media (max-width: 900px) {
      .full-screen { grid-template-columns: 1fr; padding: 32px 20px; }
      .card { order: -1; }
    }
  </style>
</head>
<body>
  <main class="full-screen">
    <section class="message">
      <h1>Validar código</h1>
      <p>Digite o código enviado para o seu email para continuar a recuperação da senha.</p>
      <ul class="steps">
        <li><span>1</span> Informe a matrícula e o código.</li>
        <li><span>2</span> Aguarde a validação.</li>
        <li><span>3</span> Crie sua nova senha.</li>
      </ul>
    </section>

    <section class="card">
      <form id="otpVerifyForm" class="form-grid" novalidate>
        <div>
          <label for="matricula">Matrícula</label>
          <input id="matricula" type="text" inputmode="numeric" maxlength="13" required>
        </div>
        <div>
          <label for="otp">Código OTP</label>
          <input id="otp" type="text" inputmode="numeric" maxlength="6" required>
        </div>
        <button class="btn-primary" type="submit">Validar</button>
        <p id="status" class="status"></p>
      </form>

      <a class="link" href="solicitar-otp.html">Voltar</a>
    </section>
  </main>

  <script>
    const form = document.getElementById('otpVerifyForm');
    const statusEl = document.getElementById('status');
    const matriculaInput = document.getElementById('matricula');
    const savedMatricula = localStorage.getItem('otpMatricula') || localStorage.getItem('recuperacaoMatricula');
    if (savedMatricula) matriculaInput.value = savedMatricula;

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      statusEl.textContent = 'Validando...';
      const matricula = matriculaInput.value.trim();
      const otp = document.getElementById('otp').value.trim();

      try {
        const res = await fetch('/auth/password/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ matricula, otp })
        });
        const data = await res.json();
        if (!data.sucesso) {
          statusEl.textContent = data.mensagem || 'Código inválido.';
          return;
        }
        localStorage.setItem('resetToken', data.reset_token);
        if (matricula) localStorage.setItem('otpMatricula', matricula);
        statusEl.textContent = 'Código válido!';
        setTimeout(() => { location.href = 'redefinir-senha.html'; }, 1000);
      } catch {
        statusEl.textContent = 'Erro ao validar código.';
      }
    });
  </script>
</body>
</html>
