<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Logs</title>
  <link rel="icon" type="image/png" href="assets/ifro.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/light-override.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300,0,0" rel="stylesheet" />
</head>
<body data-theme="light">
  <div id="appShell">
    <nav class="navbar">
      <div class="navbar-left">
        <button class="icon-btn nav-hamburger" onclick="toggleSideNav()" aria-label="Abrir menu">
          <span class="material-symbols-outlined">menu</span>
        </button>
        <div>
          <div class="page-title">Logs de auditoria</div>
          <div class="page-subtitle">Acoes administrativas do sistema</div>
        </div>
      </div>
      <div class="navbar-right">
        <button class="btn-outline" onclick="toggleTheme()">Tema</button>
        <button id="logoutBtn" class="btn-danger">Sair</button>
      </div>
    </nav>

    <div class="app-body">
      <aside id="sideNav" class="side-drawer">
        <div class="side-header">JICS Admin</div>
        <a class="side-link" href="admin-admins.html">Administradores</a>
        <a class="side-link active" href="admin-logs.html">Logs</a>
        <a class="side-link" href="admin-sorteio.html">Sorteio</a>
        <a class="side-link" href="admin-sumula.html">Sumula</a>
        <a class="side-link" href="admin-ranking.html">Ranking</a>
      </aside>

      <main class="page">
        <section class="card">
          <div class="form-row">
            <div class="form-group">
              <label>De</label>
              <input id="fromDate" type="date" />
            </div>
            <div class="form-group">
              <label>Ate</label>
              <input id="toDate" type="date" />
            </div>
            <div class="form-group">
              <label>Admin</label>
              <select id="adminFilter">
                <option value="">Todos</option>
              </select>
            </div>
            <div class="form-group">
              <label>Entidade</label>
              <input id="entityFilter" placeholder="Entidade" />
            </div>
            <div class="form-group">
              <label>Buscar na acao</label>
              <input id="queryFilter" placeholder="Ex: cadastro" />
            </div>
            <div class="form-group" style="align-self:end;">
              <button id="applyFilter" class="btn-primary">Aplicar filtros</button>
            </div>
          </div>
        </section>

        <section class="card">
          <div class="table-responsive">
            <table class="table">
              <thead>
                <tr>
                  <th>Data</th>
                  <th>Admin</th>
                  <th>Acao</th>
                  <th>Entidade</th>
                  <th>ID</th>
                  <th>IP</th>
                </tr>
              </thead>
              <tbody id="logsTable"></tbody>
            </table>
          </div>
        </section>

        <section class="page-header" style="align-items:center;">
          <button id="prevPage" class="btn-outline">Anterior</button>
          <span id="pageInfo" class="page-subtitle">Pagina 1</span>
          <button id="nextPage" class="btn-outline">Proximo</button>
        </section>
      </main>
    </div>

    <div id="sideOverlay" class="overlay"></div>
  </div>

  <script src="ui-kit.js"></script>
  <script>
    const sideNav = document.getElementById('sideNav');
    const sideOverlay = document.getElementById('sideOverlay');

    function toggleSideNav() {
      sideNav.classList.toggle('open');
      sideOverlay.classList.toggle('active');
    }

    sideOverlay.addEventListener('click', () => {
      sideNav.classList.remove('open');
      sideOverlay.classList.remove('active');
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      openConfirmModal({
        title: 'Sair do sistema',
        message: 'Digite CONFIRMAR para encerrar a sessao.',
        confirmText: 'CONFIRMAR',
        onConfirm: async () => {
          await fetch('/auth/admin/logout', { method: 'POST', credentials: 'include' });
          window.location.href = 'admin-login.html';
        }
      });
    });

    let page = 1;
    const limit = 20;
    let total = 0;

    function renderSkeleton() {
      const tbody = document.getElementById('logsTable');
      tbody.innerHTML = Array.from({ length: 6 }).map(() => `
        <tr>
          ${Array.from({ length: 6 }).map(() => `<td><div class="skeleton-line"></div></td>`).join('')}
        </tr>
      `).join('');
    }

    function renderLogs(items) {
      const tbody = document.getElementById('logsTable');
      if (!items.length) {
        tbody.innerHTML = `<tr><td colspan="6" class="center muted" style="padding:18px;">Nenhum log encontrado.</td></tr>`;
        return;
      }
      tbody.innerHTML = items.map(l => `
        <tr>
          <td>${new Date(l.criado_em).toLocaleString('pt-BR')}</td>
          <td>${l.admin_nome || '-'}</td>
          <td>${l.acao}</td>
          <td>${l.entidade}</td>
          <td>${l.entidade_id || '-'}</td>
          <td>${l.ip || '-'}</td>
        </tr>
      `).join('');
    }

    async function fetchAdmins() {
      try {
        const res = await fetch('/admins', { credentials: 'include' });
        const data = await res.json();
        if (!data.sucesso) throw new Error();
        const select = document.getElementById('adminFilter');
        (data.data || []).forEach(a => {
          const opt = document.createElement('option');
          opt.value = a.id;
          opt.textContent = a.nome;
          select.appendChild(opt);
        });
      } catch {
        showToast({ type: 'warning', title: 'Aviso', message: 'Nao foi possivel carregar admins.' });
      }
    }

    async function fetchLogs() {
      renderSkeleton();
      const params = new URLSearchParams();
      const from = document.getElementById('fromDate').value;
      const to = document.getElementById('toDate').value;
      const admin_id = document.getElementById('adminFilter').value;
      const entidade = document.getElementById('entityFilter').value.trim();
      const q = document.getElementById('queryFilter').value.trim();
      if (from) params.append('from', from);
      if (to) params.append('to', to);
      if (admin_id) params.append('admin_id', admin_id);
      if (entidade) params.append('q', entidade);
      if (q) params.append('q', q);
      params.append('limit', limit);
      params.append('offset', (page - 1) * limit);

      try {
        const res = await fetch(`/logs?${params.toString()}`, { credentials: 'include' });
        const data = await res.json();
        if (!data.sucesso) throw new Error(data?.erro?.mensagem || 'Erro');
        total = data.data.total;
        renderLogs(data.data.items || []);
        document.getElementById('pageInfo').textContent = `Pagina ${page}`;
      } catch (err) {
        showToast({ type: 'error', title: 'Erro', message: err.message || 'Falha ao carregar logs.' });
      }
    }

    document.getElementById('applyFilter').addEventListener('click', () => {
      page = 1;
      fetchLogs();
    });

    document.getElementById('prevPage').addEventListener('click', () => {
      if (page > 1) {
        page -= 1;
        fetchLogs();
      }
    });
    document.getElementById('nextPage').addEventListener('click', () => {
      if (page * limit < total) {
        page += 1;
        fetchLogs();
      }
    });

    fetchAdmins();
    fetchLogs();
  </script>
</body>
</html>
