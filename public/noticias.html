<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300,0,0" rel="stylesheet" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IFRO Esportes - Notícias</title>
  <link rel="icon" type="image/png" href="/assets/ifro.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="no-drawer" data-page="noticias" data-theme="light">
  <div id="appShell">
    <nav class="navbar">
      <div class="navbar-left">
        <button class="navbar-brand" onclick="scrollToTop()">IFRO ESPORTES</button>
        <div class="navbar-links">
          <a class="nav-link" href="dashboard.html">Início</a>
          <a class="nav-link" href="modalidades.html">Modalidades</a>
          <a class="nav-link" href="horarios.html">Horários</a>
          <a class="nav-link" href="inscricoes.html">Inscrições</a>
          <a class="nav-link" href="noticias.html">Notícias</a>
        </div>
      </div>
      <div class="navbar-right">
        <button class="icon-btn help-btn" onclick="toggleHelpPanel()"><span class="material-symbols-outlined">help</span></button>
        <div class="user-menu">
          <button class="user-trigger" onclick="toggleUserDrawer()">
            <span id="userNameNavbar" class="user-name"></span>
            <img id="userAvatar" class="user-avatar" src="/assets/avatar-default.png" alt="Avatar" onerror="this.src='/assets/avatar-default.png'">
          </button>
        </div>
      </div>
    </nav>

    <div class="app-body">
      <main class="page noticias-page">
        <section class="page-hero">
          <div class="page-hero__copy">
            <span class="page-hero__badge">Mural de comunicados</span>
            <h1>Notícias</h1>
            <p>Fique por dentro dos avisos oficiais, editais e comunicados do evento.</p>
          </div>
          <div class="page-hero__panel">
            <div class="page-search">
              <span class="material-symbols-outlined">search</span>
              <input id="noticiaSearch" type="search" placeholder="Buscar noticias..." />
            </div>
            <div class="page-actions">
              <button id="noticiaClear" class="btn-outline" type="button">Limpar</button>
            </div>
            <div id="noticiasCount" class="page-subtitle"></div>
          </div>
        </section>

        <section class="card admin-only">
          <div class="page-header">
            <div>
              <div class="page-title">Publicar noticia</div>
              <div class="page-subtitle">Compartilhe comunicados importantes com os participantes.</div>
            </div>
          </div>
          <form class="form-grid" onsubmit="publicarNoticia(event)">
            <div class="form-group">
              <label for="tituloNoticia">Título</label>
              <input id="tituloNoticia" type="text" placeholder="Título da notícia" />
            </div>
            <div class="form-group">
              <label for="descricaoNoticia">Descrição</label>
              <textarea id="descricaoNoticia" rows="4" placeholder="Escreva o comunicado"></textarea>
            </div>
            <button class="btn-primary" type="submit">Publicar noticia</button>
          </form>
        </section>

        <section class="card">
          <div class="page-header">
            <div>
              <div class="page-title">Ultimas noticias</div>
              <div class="page-subtitle">Atualizado conforme novas publicacoes.</div>
            </div>
          </div>
          <div id="allNoticiasGrid" class="grid-cards"></div>
        </section>
      </main>
    </div>
    <div id="drawerOverlay" class="overlay"></div>
    <div id="userDrawer" class="user-drawer"></div>
    <div id="globalModals"></div>
  </div>

  <script src="js/jsdosistema.js"></script>
  <script>
    const noticiaSearch = document.getElementById('noticiaSearch');
    const noticiaClear = document.getElementById('noticiaClear');
    const noticiasCount = document.getElementById('noticiasCount');
    const allNoticiasGrid = document.getElementById('allNoticiasGrid');

    function updateNoticiasCount() {
      if (!noticiasCount || !allNoticiasGrid) return;
      if (allNoticiasGrid.querySelector('.skeleton-card')) {
        noticiasCount.textContent = '';
        return;
      }
      if (allNoticiasGrid.querySelector('.empty-state')) {
        noticiasCount.textContent = 'Nenhuma noticia encontrada.';
        return;
      }
      const cards = Array.from(allNoticiasGrid.querySelectorAll('.card'));
      const visibleCards = cards.filter(card => card.style.display !== 'none');
      noticiasCount.textContent = cards.length
        ? `${visibleCards.length} noticia(s) encontrada(s)`
        : 'Nenhuma noticia encontrada.';
    }

    function filterNoticias() {
      if (!allNoticiasGrid) return;
      const term = (noticiaSearch?.value || '').trim().toLowerCase();
      const cards = Array.from(allNoticiasGrid.querySelectorAll('.card'));
      cards.forEach(card => {
        const text = card.textContent?.toLowerCase() || '';
        const match = !term || text.includes(term);
        card.style.display = match ? '' : 'none';
      });
      updateNoticiasCount();
    }

    if (noticiaSearch) {
      noticiaSearch.addEventListener('input', filterNoticias);
    }
    if (noticiaClear) {
      noticiaClear.addEventListener('click', () => {
        if (noticiaSearch) noticiaSearch.value = '';
        filterNoticias();
        noticiaSearch?.focus();
      });
    }
    if (allNoticiasGrid) {
      const observer = new MutationObserver(() => filterNoticias());
      observer.observe(allNoticiasGrid, { childList: true });
    }
  </script>
</body>
</html>
