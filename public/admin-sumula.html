<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Sumula</title>
  <link rel="icon" type="image/png" href="assets/ifro.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/light-override.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300,0,0" rel="stylesheet" />
</head>
<body data-theme="light">
  <div id="appShell">
    <nav class="navbar">
      <div class="navbar-left">
        <button class="icon-btn nav-hamburger" onclick="toggleSideNav()" aria-label="Abrir menu">
          <span class="material-symbols-outlined">menu</span>
        </button>
        <div>
          <div class="page-title">Sumula</div>
          <div class="page-subtitle">Atualize placar e status</div>
        </div>
      </div>
      <div class="navbar-right">
        <button class="btn-outline" onclick="toggleTheme()">Tema</button>
      </div>
    </nav>

    <div class="app-body">
      <aside id="sideNav" class="side-drawer">
        <div class="side-header">JICS Admin</div>
        <a class="side-link" href="admin-sorteio.html">Sorteio</a>
        <a class="side-link active" href="admin-sumula.html">Sumula</a>
        <a class="side-link" href="admin-ranking.html">Ranking</a>
        <a class="side-link" href="admin-admins.html">Administradores</a>
      </aside>

      <main class="page">
        <section class="card">
          <div class="page-title" style="margin-bottom:8px;">Jogo selecionado</div>
          <div id="jogoCard" class="page-subtitle">Carregando informacoes do jogo...</div>
        </section>

        <section class="card">
          <div class="form-row">
            <div class="form-group">
              <label>Placar equipe A</label>
              <input id="placarA" type="number" min="0" />
              <small id="placarAHelp" class="muted"></small>
            </div>
            <div class="form-group">
              <label>Placar equipe B</label>
              <input id="placarB" type="number" min="0" />
              <small id="placarBHelp" class="muted"></small>
            </div>
            <div class="form-group">
              <label>Status</label>
              <select id="statusSelect">
                <option value="NAO_INICIADO">Nao iniciado</option>
                <option value="EM_ANDAMENTO">Em andamento</option>
                <option value="FINALIZADO">Finalizado</option>
              </select>
            </div>
          </div>

          <div style="display:flex; gap:10px; margin-top:12px;">
            <button id="btnSalvar" class="btn-primary">Salvar</button>
            <button id="btnVoltar" class="btn-outline">Voltar</button>
          </div>
        </section>
      </main>
    </div>

    <div id="sideOverlay" class="overlay"></div>
  </div>

  <script src="ui-kit.js"></script>
  <script>
    const sideNav = document.getElementById('sideNav');
    const sideOverlay = document.getElementById('sideOverlay');

    function toggleSideNav() {
      sideNav.classList.toggle('open');
      sideOverlay.classList.toggle('active');
    }

    sideOverlay.addEventListener('click', () => {
      sideNav.classList.remove('open');
      sideOverlay.classList.remove('active');
    });

    const params = new URLSearchParams(window.location.search);
    const jogoId = params.get('jogoId');
    const jogoCard = document.getElementById('jogoCard');

    function setHelp(inputId, helpId, msg) {
      const input = document.getElementById(inputId);
      const help = document.getElementById(helpId);
      if (!input || !help) return;
      help.textContent = msg || '';
      input.classList.toggle('input-erro', Boolean(msg));
    }

    async function loadJogo() {
      if (!jogoId) {
        jogoCard.textContent = 'Jogo nao informado.';
        return;
      }
      try {
        const cached = localStorage.getItem('sumula_jogo');
        if (cached) {
          const j = JSON.parse(cached);
          if (String(j.id) === String(jogoId)) {
            renderJogo(j);
            return;
          }
        }
        jogoCard.textContent = 'Jogo carregado. Verifique dados no sorteio.';
      } catch {
        jogoCard.textContent = 'Nao foi possivel carregar o jogo.';
      }
    }

    function renderJogo(j) {
      jogoCard.innerHTML = `
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <span class="badge badge-blue">${j.modalidade || 'Modalidade'}</span>
          <span class="badge badge-blue">${j.sexo || '-'}</span>
          <span class="badge badge-blue">${j.chave || '-'}</span>
          <span class="badge badge-blue">${j.hora || 'A seguir'}</span>
        </div>
        <div style="margin-top:10px; font-weight:700;">${j.equipe_a || j.equipeA} x ${j.equipe_b || j.equipeB}</div>
      `;
      document.getElementById('placarA').value = j.placar_a ?? '';
      document.getElementById('placarB').value = j.placar_b ?? '';
      document.getElementById('statusSelect').value = j.status || 'NAO_INICIADO';
    }

    document.getElementById('btnVoltar').addEventListener('click', () => {
      window.history.back();
    });

    document.getElementById('btnSalvar').addEventListener('click', async () => {
      const placarA = document.getElementById('placarA').value;
      const placarB = document.getElementById('placarB').value;
      const status = document.getElementById('statusSelect').value;
      setHelp('placarA', 'placarAHelp', placarA === '' ? 'Informe o placar.' : '');
      setHelp('placarB', 'placarBHelp', placarB === '' ? 'Informe o placar.' : '');
      if (placarA === '' || placarB === '') return;

      showLoading(true);
      try {
        const res = await fetch(`/jogos/${jogoId}/placar`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ placar_a: Number(placarA), placar_b: Number(placarB), status })
        });
        const data = await res.json();
        if (!data.sucesso) throw new Error(data?.erro?.mensagem || 'Erro');
        showToast({ type: 'success', title: 'Sumula salva', message: 'Placar atualizado.' });
      } catch (err) {
        showToast({ type: 'error', title: 'Erro', message: err.message || 'Falha ao salvar.' });
      } finally {
        showLoading(false);
      }
    });

    loadJogo();
  </script>
</body>
</html>
