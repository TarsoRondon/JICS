<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JICS - Meus jogos</title>
  <link rel="icon" type="image/png" href="assets/ifro.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/light-override.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300,0,0" rel="stylesheet" />
</head>
<body data-theme="light">
  <div id="appShell">
    <nav class="navbar">
      <div class="navbar-left">
        <button class="icon-btn nav-hamburger" onclick="toggleSideNav()" aria-label="Abrir menu">
          <span class="material-symbols-outlined">menu</span>
        </button>
        <button class="navbar-brand">Meus jogos</button>
      </div>
      <div class="navbar-right">
        <button class="btn-outline" onclick="toggleTheme()">Tema</button>
        <button id="btnSair" class="btn-danger">Sair</button>
      </div>
    </nav>

    <div class="app-body">
      <aside id="sideNav" class="side-drawer">
        <div class="side-header">Menu</div>
        <a class="side-link" href="app-dashboard.html">Dashboard</a>
        <a class="side-link" href="app-inscricoes.html">Inscricoes</a>
        <a class="side-link active" href="app-meus-jogos.html">Meus jogos</a>
        <a class="side-link" href="app-ranking.html">Ranking</a>
        <a class="side-link" href="app-perfil.html">Perfil</a>
        <a class="side-link" href="app-ajuda.html">Ajuda</a>
      </aside>

      <main class="page with-bottom-nav">
        <section class="card">
          <div class="form-row">
            <div class="form-group">
              <label>Evento</label>
              <select id="eventoSelect"><option value="">Evento</option></select>
            </div>
            <div class="form-group">
              <label>Modalidade</label>
              <select id="modalidadeSelect"><option value="">Modalidade</option></select>
            </div>
            <div class="form-group">
              <label>Sexo</label>
              <select id="sexoSelect">
                <option value="">Sexo</option>
                <option value="M">Masculino</option>
                <option value="F">Feminino</option>
              </select>
            </div>
            <div class="form-group" style="align-self:end;">
              <button id="btnAtualizar" class="btn-primary">Atualizar</button>
            </div>
          </div>
        </section>

        <section class="card">
          <div id="jogosTable" class="table-responsive"></div>
        </section>
      </main>
    </div>

    <div id="sideOverlay" class="overlay"></div>

    <nav class="bottom-nav">
      <a class="bottom-link" href="app-dashboard.html">
        <span class="material-symbols-outlined">home</span>
        Dashboard
      </a>
      <a class="bottom-link" href="app-inscricoes.html">
        <span class="material-symbols-outlined">how_to_reg</span>
        Inscricoes
      </a>
      <a class="bottom-link active" href="app-meus-jogos.html">
        <span class="material-symbols-outlined">sports_soccer</span>
        Jogos
      </a>
      <a class="bottom-link" href="app-ranking.html">
        <span class="material-symbols-outlined">leaderboard</span>
        Ranking
      </a>
      <a class="bottom-link" href="app-perfil.html">
        <span class="material-symbols-outlined">person</span>
        Perfil
      </a>
    </nav>
  </div>

  <script src="ui-kit.js"></script>
  <script>
    const sideNav = document.getElementById('sideNav');
    const sideOverlay = document.getElementById('sideOverlay');

    function toggleSideNav() {
      sideNav.classList.toggle('open');
      sideOverlay.classList.toggle('active');
    }

    sideOverlay.addEventListener('click', () => {
      sideNav.classList.remove('open');
      sideOverlay.classList.remove('active');
    });

    document.getElementById('btnSair').addEventListener('click', () => {
      openConfirmModal({
        title: 'Sair do sistema',
        message: 'Digite CONFIRMAR para sair.',
        confirmText: 'CONFIRMAR',
        onConfirm: async () => {
          await fetch('/auth/aluno/logout', { method: 'POST', credentials: 'include' });
          window.location.href = 'app-login.html';
        }
      });
    });

    function statusClass(status) {
      const s = String(status || '').toLowerCase();
      if (s === 'em_andamento') return 'status-pill status-em_andamento';
      if (s === 'finalizado') return 'status-pill status-finalizado';
      return 'status-pill status-nao_iniciado';
    }

    async function api(url) {
      showLoading(true);
      try {
        const res = await fetch(url, { credentials: 'include' });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || data.sucesso === false) throw new Error(data?.erro?.mensagem || 'Erro');
        return data.data || data;
      } finally {
        showLoading(false);
      }
    }

    async function fetchEventos() {
      try {
        const data = await api('/eventos');
        const select = document.getElementById('eventoSelect');
        (data || []).forEach(e => {
          const opt = document.createElement('option');
          opt.value = e.id;
          opt.textContent = `${e.nome} (${e.ano})`;
          select.appendChild(opt);
        });
      } catch {}
    }

    async function fetchModalidades() {
      try {
        const data = await api('/modalidades');
        const select = document.getElementById('modalidadeSelect');
        (data || []).forEach(m => {
          const opt = document.createElement('option');
          opt.value = m.id;
          opt.textContent = m.titulo || m.nome;
          select.appendChild(opt);
        });
      } catch {}
    }

    function renderJogos(list) {
      const container = document.getElementById('jogosTable');
      if (!list.length) {
        container.innerHTML = '<div class="empty-state">Sem jogos para este filtro.</div>';
        return;
      }
      container.innerHTML = `
        <table class="table">
          <thead>
            <tr>
              <th>Data/Hora</th>
              <th>Modalidade</th>
              <th>Chave</th>
              <th>Adversario</th>
              <th>Local</th>
              <th>Status</th>
              <th>Placar</th>
            </tr>
          </thead>
          <tbody>
            ${list.map(j => `
              <tr>
                <td>${j.data || j.hora || '-'}</td>
                <td>${j.modalidade || '-'}</td>
                <td>${j.chave || '-'}</td>
                <td>${j.adversario || '-'}</td>
                <td>${j.local || '-'}</td>
                <td><span class="${statusClass(j.status)}">${j.status || 'NAO_INICIADO'}</span></td>
                <td>${j.placar || '-'}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    async function fetchJogos() {
      const eventoId = document.getElementById('eventoSelect').value;
      const modalidadeId = document.getElementById('modalidadeSelect').value;
      const sexo = document.getElementById('sexoSelect').value;
      if (!eventoId || !modalidadeId) {
        showToast({ type: 'warning', title: 'Atencao', message: 'Selecione evento e modalidade.' });
        return;
      }
      try {
        const data = await api(`/aluno/jogos?eventoId=${eventoId}&modalidadeId=${modalidadeId}&sexo=${sexo}`);
        renderJogos(data || []);
      } catch (err) {
        showToast({ type: 'error', title: 'Erro', message: err.message || 'Falha ao carregar jogos.' });
        renderJogos([]);
      }
    }

    document.getElementById('btnAtualizar').addEventListener('click', fetchJogos);

    fetchEventos();
    fetchModalidades();
  </script>
</body>
</html>
