<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IFRO Esportes - Conectando</title>
  <link rel="icon" type="image/png" href="assets/ifro.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/light-override.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" />
</head>
<body data-page="gov-callback" data-theme="light">
  <div class="login-shell">
    <div class="login-card">
      <div>
        <h1 class="page-title">Conectando...</h1>
        <p class="page-subtitle">Aguarde enquanto validamos seu acesso.</p>
      </div>
    </div>
  </div>

  <script>
    (async () => {
      try {
        const res = await fetch('/auth/govbr/session', { credentials: 'include' });
        const data = await res.json();
        if (!data.ok || !data.user) {
          window.location.href = 'index.html';
          return;
        }
        localStorage.setItem('usuarioLogado', JSON.stringify(data.user));
        window.location.href = 'dashboard.html';
      } catch {
        window.location.href = 'index.html';
      }
    })();
  </script>
</body>
</html>
